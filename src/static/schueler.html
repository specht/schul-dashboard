#{this_is_a_page_for_logged_in_teachers}
<style>
    .sp-page { max-width: 60em; padding-block: 1em 3em; }
    .sp-head { display: flex; align-items: flex-start; gap: 1em; margin-bottom: 1.2em; }
    .sp-avatar { flex: none; }
    /* the picture from Nextcloud, a quiet circle without one */
    .sp-avatar-img { width: 4.5rem; height: 4.5rem; border-radius: 50%; background-size: cover; background-position: center; background-color: var(--pv-hover, #e9ecef); }
    body.dark:not(.ui-preview) .sp-avatar-img { background-color: rgba(255, 255, 255, 0.12); }
    .sp-title { min-width: 0; }
    .sp-title h2 { margin: 0 0 0.2em; overflow-wrap: anywhere; }
    .sp-sub { margin: 0 0 0.6em; color: var(--pv-muted, #5f6368); }
    .sp-actions { display: flex; flex-wrap: wrap; gap: 0.5em; }
    .sp-page h4 { margin-top: 1.4em; }
    /* labelled rows, the labels in one column */
    .sp-facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0.45em 1.2em; align-items: start; margin: 0.6em 0 0; }
    .sp-facts dt { font-weight: 600; color: var(--pv-muted, #5f6368); padding-top: 0.1em; }
    .sp-facts dd { margin: 0; min-width: 0; }
    .sp-facts .input-group { max-width: 26em; }
    .sp-scroll { overflow-x: auto; }
    .sp-lessons { width: auto; min-width: 100%; }
    .sp-lessons td, .sp-lessons th { vertical-align: top; }
    .sp-lessons .sp-num { text-align: right; font-variant-numeric: tabular-nums; }
    .sp-dot { display: inline-block; width: 0.6em; height: 0.6em; margin-right: 0.5em; border-radius: 50%; vertical-align: 0.05em; background: var(--pv-line, transparent); }
    /* today's design has no subject colours */
    body:not(.ui-preview) .sp-dot { display: none; }
    .sp-none { color: var(--pv-muted, #5f6368); }
    @media (max-width: 575px) {
        /* phones: the label above its value */
        .sp-facts { grid-template-columns: minmax(0, 1fr); gap: 0.1em; }
        .sp-facts dd { margin-bottom: 0.6em; }
        .sp-avatar-img { width: 3.5rem; height: 3.5rem; }
    }
</style>
<div class='container sp-page'>
    <div class='api_messages' style='display: none;'></div>
    #{print_schueler_seite()}
</div>
