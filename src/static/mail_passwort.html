#{this_is_a_page_for_mail_password_reset}
<div class='container' style='padding-top: 30px; padding-bottom: 30px;'>
    <div class='row'>
        <div class='col-lg-10 offset-lg-1'>
            <h2 style='margin-bottom: 20px;'>E-Mail-Passwort zurücksetzen</h2>
            <div class='api_messages' style='display: none;'></div>
            #{print_mail_password_reset_page()}
        </div>
    </div>
</div>

<style>
    .mail-reset-row td { vertical-align: middle; }
    .mail-reset-password { font-family: monospace; font-size: 110%; }
    /* phones: name, status and button one below the other */
    @media (max-width: 575px) {
        .mail-reset-row td { display: block; border-top: none; padding: 0.3em 0.75em; }
        .mail-reset-row td:first-child { padding-top: 0.75em; }
        .mail-reset-row td.mail-reset-action { text-align: left !important; padding-bottom: 0.75em; }
        .mail-reset-row + .mail-reset-row td:first-child { border-top: 1px solid rgba(0, 0, 0, 0.1); }
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const IS_STUDENT = #{schueler_logged_in? ? 'true' : 'false'};
    const STATE_LABELS = {
        pending: 'wird bearbeitet …',
        done: 'zurückgesetzt',
        failed: 'hat nicht geklappt',
    };
    let refresh_timer = null;

    function fmt_ts(ts) {
        if (!ts) return '';
        const d = new Date(ts * 1000);
        const pad = (x) => (x < 10 ? '0' : '') + x;
        return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // password hidden until asked for (shoulder surfing in class)
    function password_widget(password) {
        const wrap = $('<div>').css('margin-top', '0.3em');
        const code = $('<span>').addClass('mail-reset-password').text(password).hide();
        const show = $('<button>').addClass('btn btn-sm btn-outline-secondary bu_show_mail_password')
            .html("<i class='fa fa-eye'></i>&nbsp;&nbsp;Passwort anzeigen");
        show.on('click', function(e) {
            $(e.currentTarget).hide();
            code.show();
        });
        wrap.append(show).append(code);
        return wrap;
    }

    function state_cell(entry, for_admin_table) {
        const cell = $('<div>');
        const label = $('<span>').addClass('mail-reset-state-label').attr('data-state', entry.state)
            .text(STATE_LABELS[entry.state] || entry.state);
        if (entry.state === 'pending') label.prepend("<i class='fa fa-cog fa-spin'></i>&nbsp;");
        if (entry.state === 'done') label.addClass('text-success');
        if (entry.state === 'failed') label.addClass('text-danger');
        cell.append(label);
        cell.append($('<small>').addClass('text-muted').text(' (' + fmt_ts(entry.ts_done || entry.ts) + ')'));
        if (entry.state === 'done' && entry.password) cell.append(password_widget(entry.password));
        if (entry.state === 'failed' && !for_admin_table) {
            cell.append($('<div>').addClass('text-muted').text(IS_STUDENT
                ? 'Die Administration wurde informiert und kümmert sich darum.'
                : 'Die Administration wurde informiert.'));
        }
        return cell;
    }

    function render(data) {
        const latest = {};
        for (const entry of data.requests) {
            if (entry.latest) latest[entry.mailbox] = entry;
        }
        $('.mail-reset-row').each(function(_, row) {
            const mailbox = $(row).data('mailbox');
            const entry = latest[mailbox];
            $(row).find('.mail-reset-state').empty().append(entry ? state_cell(entry) : '');
            $(row).find('.bu_request_mail_reset').prop('disabled', !!entry && entry.state === 'pending');
        });
        const table = $('#mail_reset_requests tbody');
        if (table.length > 0) {
            table.empty();
            for (const entry of data.requests) {
                const tr = $('<tr>').attr('data-id', entry.id);
                tr.append($('<td>').text(entry.label).append($('<br>')).append($('<small>').addClass('text-muted').text(entry.mailbox)));
                tr.append($('<td>').text(entry.requested_by || '').append($('<br>')).append($('<small>').addClass('text-muted').text(fmt_ts(entry.ts))));
                const state = $('<td>').append(state_cell(entry, true));
                if (entry.message) state.append($('<div>').addClass('text-muted').text(entry.message));
                tr.append(state);
                const actions = $('<td>').css('text-align', 'right').css('white-space', 'nowrap');
                if (entry.state === 'pending') {
                    actions.append($('<button>').addClass('btn btn-sm btn-outline-success bu_mail_reset_done').attr('data-id', entry.id).text('erledigt'));
                    actions.append(' ');
                    actions.append($('<button>').addClass('btn btn-sm btn-outline-secondary bu_mail_reset_failed').attr('data-id', entry.id).text('fehlgeschlagen'));
                }
                tr.append(actions);
                table.append(tr);
            }
            if (data.requests.length === 0) {
                table.append($('<tr>').append($('<td>').attr('colspan', 4).addClass('text-muted').text('Keine Anfragen in den letzten 30 Tagen.')));
            }
            $('#mail_reset_bot_state').text(data.bot_last_seen
                ? 'Bot zuletzt aktiv: ' + fmt_ts(data.bot_last_seen)
                : 'Der Bot war noch nie aktiv – Anfragen bitte von Hand erledigen.');
        }
        clearTimeout(refresh_timer);
        if (data.requests.some((entry) => entry.state === 'pending')) {
            refresh_timer = setTimeout(load, 10000);
        }
    }

    function load() {
        api_call('/api/mail_password_reset_status', {}, function(data) {
            if (data.success) render(data);
        }, { no_please_wait: true });
    }

    function request_reset(mailbox, label) {
        const text = IS_STUDENT
            ? 'Dein E-Mail-Passwort wird auf das ursprüngliche Passwort aus deinem E-Mail-Brief zurückgesetzt. Ein selbst gewähltes Passwort funktioniert danach nicht mehr. Deine Eltern bekommen eine kurze Nachricht darüber.'
            : `Das Passwort für ${label} (${mailbox}) wird auf das ursprüngliche Passwort aus dem E-Mail-Brief zurückgesetzt. Ein selbst gewähltes Passwort funktioniert danach nicht mehr.`;
        dashboardConfirm(text, function() {
            api_call('/api/request_mail_password_reset', { mailbox: mailbox }, function(data) {
                if (!data.success) return;
                if (data.result === 'pending') {
                    dashboardAlert('Für dieses Postfach läuft schon eine Anfrage.', 'Schon angefordert');
                } else if (data.result === 'limit') {
                    dashboardAlert('Das Passwort wurde heute schon mehrmals zurückgesetzt. Bitte versuche es morgen noch einmal oder wende dich an die Administration.', 'Heute nicht mehr möglich');
                }
                load();
            });
        }, { title: 'E-Mail-Passwort zurücksetzen?', confirm: 'Zurücksetzen', danger: true });
    }

    $('.bu_request_mail_reset').on('click', function(e) {
        const button = $(e.currentTarget);
        request_reset(button.data('mailbox'), button.data('label'));
    });
    $('#bu_request_mail_reset_mailbox').on('click', function() {
        const mailbox = $('#ti_mail_reset_mailbox').val().trim().toLowerCase();
        if (mailbox.length === 0) return;
        request_reset(mailbox, mailbox);
    });
    $('#mail_reset_requests').on('click', '.bu_mail_reset_done, .bu_mail_reset_failed', function(e) {
        const button = $(e.currentTarget);
        const state = button.hasClass('bu_mail_reset_done') ? 'done' : 'failed';
        api_call('/api/set_mail_password_reset_state', { id: button.data('id'), state: state }, function(data) {
            if (data.success) load();
        });
    });

    load();
});
</script>
