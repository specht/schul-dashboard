#{redirect_on_error { require_user! }}
<style>
.spa-container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1em;
    text-align: center;
}
.spa-tafel {
    display: block;
    width: fit-content;
    margin: 1.5em auto 0 auto;
    background-color: #2f3e2f;
    color: #fff;
    font-weight: bold;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.4em 3em;
    border-radius: 0.3em;
    box-shadow: 0 0.2em 0.4em rgba(0,0,0,0.3);
}
#spa_seats {
    position: relative;
    margin: 2em auto;
}
#spa_seats .place {
    position: absolute;
    box-shadow: 0 0 0.7vh rgba(0,0,0,0.5);
    background-color: #fff;
    border-radius: 1vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: bold;
    padding: 4px;
    word-break: break-word;
}
.spa-empty-hint {
    color: #666;
    margin-top: 2em;
}
#spa_bu_print {
    display: none;
}
/* Ausdruck: nur Überschrift, Tafel und Plätze, ohne Dashboard-Menü,
   Hintergrundbild und Schatten (die werden oft gar nicht oder grau gedruckt). */
@page {
    size: landscape;
    margin: 1cm;
}
@media print {
    nav, .foot, a.github, .info, #advent_calendar, .grain_overlay, .spa-no-print {
        display: none !important;
    }
    body {
        background: #fff !important;
        color: #000 !important;
        padding: 0 !important;
        margin: 0 !important;
    }
    #main_container::after {
        display: none !important;
    }
    .spa-container {
        max-width: none;
        padding: 0;
    }
    .spa-container h1 {
        margin-top: 0;
    }
    .spa-tafel {
        background: #fff;
        color: #000;
        border: 2px solid #000;
        box-shadow: none;
    }
    #spa_seats {
        margin: 1.5em auto 0 auto;
    }
    #spa_seats .place {
        box-shadow: none;
        border: 1.5px solid #000;
        color: #000;
    }
}
</style>
<div class="spa-container">
    <h1>Sitzplan <span id="spa_label"></span></h1>
    <p id="spa_saved_at" class="text-muted"></p>
    <button class="btn btn-light spa-no-print" id="spa_bu_print"><i class="fa fa-print"></i>&nbsp;&nbsp;Drucken</button>
    <span class="spa-tafel">Tafel</span>
    <div id="spa_seats"></div>
    <p class="spa-empty-hint" id="spa_empty_hint" style="display: none;">Für diese Klasse/diesen Raum wurde noch kein Sitzplan gespeichert.</p>
</div>

<script>
var klasse = '';
var raum = '';
var seats = [];
var seats_dict = {};

// Raum-Layouts, geteilt mit dem Sitzplan-Shuffler. Fehlt die Datei, bleibt
// seats_dict leer und unten erscheint ein Hinweis statt eines Serverfehlers.
#{File.exist?('/data/sitzplan/seats.js') ? File.read('/data/sitzplan/seats.js') : ''}

document.addEventListener('DOMContentLoaded', function () {
    let parts = window.location.pathname.replace('/sitzplananzeige/', '').split('/');
    klasse = parts[0];
    raum = parts[1];
    seats = seats_dict[raum];
    if (!seats) {
        $('.spa-container').empty()
            .append($('<h1>').text('Sitzplan'))
            .append($('<p>').text(`Für Raum ${raum} ist noch kein Sitzplan hinterlegt.`));
        return;
    }
    $('#spa_label').text(`${klasse} – Raum ${raum}`);

    // Ohne ?cycle=... wird der zuletzt gespeicherte Plan gezeigt (Normalfall
    // für SuS). Mit ?cycle=... zeigt der Link aus der Historien-Liste im
    // Sitzplanhelfer gezielt einen bestimmten, ggf. älteren Plan.
    let cycle_id = new URLSearchParams(window.location.search).get('cycle');
    let request = {klasse: klasse, raum: raum};
    if (cycle_id) request.cycle_id = cycle_id;

    api_call('/api/sph_get_public_plan', request, function (data) {
        if (!data.places || data.places.length === 0) {
            $('#spa_empty_hint').show();
            return;
        }
        if (data.saved_at) {
            let d = new Date(data.saved_at * 1000);
            $('#spa_saved_at').text(`Stand: ${d.toLocaleDateString('de-DE')}`);
        }
        places = data.places;
        render_seats(false);
        $('#spa_bu_print').show().on('click', function () { window.print(); });
        // Für den Ausdruck auf eine Querformat-Seite zugeschnitten zeichnen,
        // danach wieder in Bildschirmgröße.
        window.addEventListener('beforeprint', function () { render_seats(true); });
        window.addEventListener('afterprint', function () { render_seats(false); });
        // ?print=1 (Link „Sitzplan drucken" im Sitzplanhelfer) öffnet direkt
        // den Druckdialog.
        if (new URLSearchParams(window.location.search).get('print') === '1') {
            setTimeout(function () { window.print(); }, 300);
        }
    });
});

var places = [];

function render_seats(for_print) {
    let w = 1, h = 1;
    for (let s of seats) {
        if (s[0] + 1 > w) w = s[0] + 1;
        if (s[1] + 1 > h) h = s[1] + 1;
    }
    let container = $('#spa_seats').empty();
    let scale;
    if (for_print) {
        // A4 quer mit 1 cm Rand: ca. 1040 × 720 px nutzbar, davon gehen
        // Überschrift und Tafel ab.
        scale = Math.min(110, 1000 / w, 500 / h);
    } else {
        let container_width = Math.min($('.spa-container').width() || 900, 900);
        scale = Math.min(90, container_width / w);
    }
    container.css('height', `${h * scale}px`).css('width', `${w * scale}px`);
    for (let place of places) {
        let seat = seats[place.seat_index];
        if (!seat) continue;
        let div = $('<div>').addClass('place')
            .css('left', `${seat[0] * scale}px`).css('top', `${seat[1] * scale}px`)
            .css('width', `${scale * 0.9}px`).css('height', `${scale * 0.9}px`)
            .css('font-size', `${scale * 0.14}px`)
            .text(place.display_name);
        container.append(div);
    }
}
</script>
