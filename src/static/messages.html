#{this_is_a_page_for_logged_in_users}
<div class='container'>
    <div class='row'>
        <div class='col-md-8 offset-md-2'>
            <h2 style='margin-bottom: 30px;'>Nachrichten</h2>
            <div style='display: #{user_with_role_logged_in?(:can_write_messages) ? 'block': 'none'}; position: relative;'>
                <div class='btn-group'>
                    <button id='bu-inbox' class='btn btn-primary'><i class='fa fa-inbox'></i>&nbsp;&nbsp;Posteingang</button>
                    <button id='bu-outbox' class='btn btn-outline-secondary'><i class='fa fa-inbox'></i>&nbsp;&nbsp;Postausgang</button>
                </div>
                <button class='bu-compose btn btn-success bu-compose-message'><i class='fa fa-pencil'></i>&nbsp;&nbsp;Neue Nachricht</button>
                <hr />
            </div>
            <div class='messages-container-inbox'></div>
            <div class='messages-container-outbox' style='display: none;'>
                <table class='table table-striped narrow'>
                <thead>
                    <tr>
                        <th style='width: 120px;'>Datum</th>
                        <th>Empfänger</th>
                        <th>Nachricht</th>
                    </tr>
                </thead>
                <tbody class='outbox-messages-here'>
                </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal" id="composeModal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered" role="document">
    <div class="modal-content">
     <div class="modal-header">
        <h5 class="modal-title">Neue Nachricht</h5>
      </div>
      <div class="modal-body">
        <div class="form-group">
            <input id='ti_recipients' class='form-control' placeholder='Empfänger suchen…'><div class='recipient-input-dropdown' style='display: none;'></div></input>
        </div>
        <div class="form-group">
            <div class='recipients_list'>
            </div>
            <p style='margin-top: 10px;' id='recipient_count'>keine Empfänger</p>
        </div>
        <div class="form-group">
            <div id='summernote'></div>
        </div>
      </div>
      <div class="modal-footer">
        <div id='publish_message_btn_container'>
            <button id='bu_discard_message' class='btn btn-outline-secondary' disabled><i class='fa fa-times'></i>&nbsp;&nbsp;<span>Verwerfen</span></button>
            <button id='bu_send_message' class='btn btn-outline-secondary' disabled><i class='fa fa-send'></i>&nbsp;&nbsp;<span>Senden</span></button>
        </div>
        <button id='bu_delete_message' type="button" class="btn btn-outline-secondary" disabled style='display: none;'><i class='fa fa-trash'></i>&nbsp;&nbsp;Nachricht löschen</button>
        <button id='bu_close_message_modal' type="button" class="btn btn-secondary" data-dismiss="modal">Schließen</button>
      </div>
    </div>
  </div>
</div>

<script>
var recipients = {};
var recipients_cache = {};
var autocomplete_results = {};
var recipients_list = {};
var net_recipients_list = [];
var old_recipients_list = [];
var old_message = '';
var old_mid = null;
var observer = null;
var sent_messages = #{sent_messages.to_json};
var antikenfahrt_recipients = #{@@antikenfahrt_recipients.to_json};
var message_cache = {};
var force_close = false;
// Neues Design (Vorschau): which messages are new, the senders' profile
// pictures (main.rb), and a class for the page's own styles (preview/messages.css)
var pv_messages = #{messages_preview.to_json};
var PV_MESSAGES = document.body.classList.contains('ui-preview');
// (plain DOM: this runs while the page loads, before jQuery)
if (PV_MESSAGES) {
    document.body.classList.add('pv-messages-page');
    // the title with "Neue Nachricht" next to it
    let title = document.querySelector('.messages-container-inbox').closest('.col-md-8').querySelector('h2');
    let top = document.createElement('div');
    top.className = 'pv-msg-top';
    title.before(top);
    top.append(title);
    if ('#{user_with_role_logged_in?(:can_write_messages)}' === 'true')
        top.append(document.querySelector('.bu-compose-message'));
    // the inbox like a mail app: on the left the list (switch, search, rows
    // divided by hairlines), on the right the opened message – side by side
    // on wide screens, one after the other on narrow ones
    let col = top.parentElement;
    col.classList.add('pv-msg-col');
    let switcher = document.getElementById('bu-inbox').closest('.btn-group').parentElement;
    switcher.classList.add('pv-mail-switch');
    switcher.querySelector('.btn-group').setAttribute('aria-label', 'Ordner');
    document.getElementById('bu-inbox').innerHTML = "Eingang<span class='pv-seg-count'></span>";
    document.getElementById('bu-outbox').innerHTML = 'Gesendet';
    let mail = document.createElement('div');
    mail.className = 'pv-mail';
    let pane = document.createElement('div');
    pane.className = 'pv-mail-list';
    let search = document.createElement('div');
    search.className = 'pv-mail-search';
    search.innerHTML = "<i class='fa fa-search' aria-hidden='true'></i><input type='search' id='ti_pv_search' class='form-control' placeholder='Suchen' aria-label='Nachrichten durchsuchen' autocomplete='off'>";
    pane.append(switcher, search);
    for (let box of ['inbox', 'outbox']) {
        let container = document.querySelector('.messages-container-' + box);
        let rows = document.createElement('div');
        rows.className = 'pv-mail-rows';
        let more = document.createElement('div');
        more.className = 'pv-mail-more';
        more.hidden = true;
        more.innerHTML = "<button type='button' class='btn bu_pv_more'>Ältere Nachrichten</button>";
        container.append(rows, more);
        pane.append(container);
    }
    let reader = document.createElement('section');
    reader.className = 'pv-mail-reader';
    reader.setAttribute('aria-label', 'Nachricht');
    mail.append(pane, reader);
    col.append(mail);
    // the compose dialog: a sheet on phones; recipients as chips in one field
    // with the search, the suggestions below it
    let modal = document.getElementById('composeModal');
    modal.classList.add('pv-sheet');
    modal.querySelector('.modal-dialog').classList.add('modal-dialog-scrollable');
    let input = document.getElementById('ti_recipients');
    let group = input.closest('.form-group');
    group.classList.add('pv-rcpt');
    let list = modal.querySelector('.recipients_list');
    let old_group = list.closest('.form-group');
    let field = document.createElement('div');
    field.className = 'pv-rcpt-field';
    let label = document.createElement('label');
    label.htmlFor = 'ti_recipients';
    label.className = 'pv-rcpt-label';
    label.textContent = 'An';
    field.append(label, list, input);
    let box = document.createElement('div');
    box.className = 'pv-rcpt-box';
    let dropdown = modal.querySelector('.recipient-input-dropdown');
    dropdown.setAttribute('role', 'listbox');
    dropdown.setAttribute('aria-label', 'Vorschläge');
    box.append(field, dropdown);
    group.prepend(box);
    let count = document.getElementById('recipient_count');
    count.classList.add('pv-rcpt-count');
    count.setAttribute('aria-live', 'polite');
    group.append(count);
    old_group.remove();
    let delete_button = document.getElementById('bu_delete_message');
    delete_button.lastChild.textContent = '\u00a0\u00a0Löschen';
    input.placeholder = 'Name, Klasse oder Gruppe suchen …';
    input.autocomplete = 'off';
    field.addEventListener('click', function(e) {
        if (e.target === e.currentTarget || e.target === list)
            input.focus();
    });
    // the suggestions close when one clicks elsewhere
    document.addEventListener('click', function(e) {
        if (!e.target.closest || !e.target.closest('.pv-rcpt'))
            dropdown.style.display = 'none';
    });
}

// ---------- New design (preview): the inbox like a mail app ----------
// The list shows 50 rows at a time (more while scrolling or with "Ältere
// Nachrichten"); a row's text is loaded only when the row becomes visible.
// The opened message is in the address (#nachricht/…, #gesendet/…), so that
// a reload keeps it and, on narrow screens, the back button closes it.
var PV_CHUNK = 50;
var PV_TWO_PANES = 840; // content width from which list and message stand side by side
var PV_CAN_REPLY = '#{teacher_logged_in?}' === 'true';
var PV_CAN_WRITE = '#{user_with_role_logged_in?(:can_write_messages)}' === 'true';
var PV_MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
var pv = {
    box: 'in',
    items: {in: null, out: null},   // all messages of a box (null: not there yet)
    list: {in: [], out: []},        // those matching the search
    shown: {in: 0, out: 0},         // rows rendered
    group: {in: null, out: null},   // the last heading rendered
    query: '',
    rendered_query: {in: null, out: null},
    open: null,                     // {box, key}
    two: false,
    scroll: 0,
    want: null,                     // from the address, until the lists are there
    unread: {},
    text: {},                       // mid → {html, text}
    sent_keys: {},                  // mid → recipients, groups compacted
    sent_ts: {},                    // mid → time sent
    loading: {},
    preview_observer: null,
    more_observer: null,
};

function pv_key(box, m) {
    return String(box === 'in' ? (m.mid || m.id || '') : m.mid);
}

function pv_find(box, key) {
    return (pv.items[box] || []).find(function(m) { return pv_key(box, m) === key; }) || null;
}

// plain text of a message (for the preview and the search), parsed without
// touching the page
function pv_html_text(html) {
    let doc = new DOMParser().parseFromString(html || '', 'text/html');
    for (let el of doc.body.querySelectorAll('p, div, li, br, h1, h2, h3, h4, tr, td'))
        el.after(' ');
    return (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
}

function pv_text(mid) {
    let html = message_cache[mid];
    if (typeof(html) === 'undefined')
        return null;
    let cached = pv.text[mid];
    if (!cached || cached.html !== html) {
        cached = {html: html, text: pv_html_text(html)};
        pv.text[mid] = cached;
    }
    return cached.text;
}

// a message's text from /gen/m/…, once, also for several callers
function pv_load_body(mid, done) {
    if (mid in message_cache) {
        done(message_cache[mid]);
        return;
    }
    if (pv.loading[mid]) {
        pv.loading[mid].push(done);
        return;
    }
    pv.loading[mid] = [done];
    let finish = function(html) {
        let waiting = pv.loading[mid] || [];
        delete pv.loading[mid];
        for (let f of waiting)
            f(html);
    };
    fetch('/gen/m/' + mid.substr(0, 2) + '/' + mid.substr(2) + '.html.gz').then(function(response) {
        if (!response.ok)
            throw new Error(response.status);
        return response.arrayBuffer();
    }).then(function(buffer) {
        let html = new TextDecoder('utf-8').decode(pako.ungzip(new Uint8Array(buffer)));
        message_cache[mid] = html;
        finish(html);
    }).catch(function() {
        finish(null);
    });
}

function pv_ts(m) {
    if (m.timestamp)
        return m.timestamp;
    let d = (m.date || '1970-01-01').split('-');
    return new Date(+d[0], +d[1] - 1, +d[2], 12).getTime() / 1000;
}

function pv_midnight(d) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

// the heading a message is listed under: Heute, Gestern, Diese Woche, then months
function pv_group(ts) {
    let d = new Date(ts * 1000);
    let today = pv_midnight(new Date());
    let day = pv_midnight(d);
    let days = Math.round((today - day) / 86400000);
    if (days <= 0)
        return 'Heute';
    if (days === 1)
        return 'Gestern';
    let monday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - (today.getDay() + 6) % 7);
    if (day >= monday)
        return 'Diese Woche';
    let label = PV_MONTHS[d.getMonth()];
    if (d.getFullYear() !== today.getFullYear())
        label += ' ' + d.getFullYear();
    return label;
}

function pv_hm(d) {
    return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
}

// the time in a row: 10:14 (today and yesterday), Mo (this week), 12.11.
function pv_row_time(ts) {
    let d = new Date(ts * 1000);
    let group = pv_group(ts);
    if (group === 'Heute' || group === 'Gestern')
        return pv_hm(d);
    if (group === 'Diese Woche')
        return weekdays[d.getDay()];
    return d.getDate() + '.' + (d.getMonth() + 1) + '.';
}

// the time in the opened message: Di, 17.11., 10:14 Uhr
function pv_full_time(ts) {
    let d = new Date(ts * 1000);
    let s = weekdays[d.getDay()] + ', ' + d.getDate() + '.' + (d.getMonth() + 1) + '.';
    if (d.getFullYear() !== new Date().getFullYear())
        s += d.getFullYear();
    return s + ', ' + pv_hm(d) + ' Uhr';
}

// the sender's profile picture from Nextcloud, a calm grey circle without one
function pv_avatar(email) {
    let avatar = $('<span>').addClass('pv-msg-avatar').attr('aria-hidden', 'true');
    let nc_login = (pv_messages.nc_logins || {})[email];
    if (nc_login)
        avatar.css('background-image', `url(#{NEXTCLOUD_URL}/index.php/avatar/${encodeURIComponent(nc_login)}/64)`);
    return avatar;
}

function pv_sent_keys(m) {
    if (!(m.mid in pv.sent_keys))
        pv.sent_keys[m.mid] = (recipients_cache.groups ? compact_address_list(m.recipients || []) : (m.recipients || []));
    return pv.sent_keys[m.mid];
}

function pv_label(key) {
    return (recipients[key] || {}).label || key;
}

// "an Klasse 7b und 2 weitere"
function pv_sent_summary(m) {
    let keys = pv_sent_keys(m);
    if (keys.length === 0)
        return 'ohne Empfänger';
    if (keys.length === 1)
        return 'an ' + pv_label(keys[0]);
    if (keys.length === 2)
        return 'an ' + pv_label(keys[0]) + ' und ' + pv_label(keys[1]);
    return 'an ' + pv_label(keys[0]) + ' und ' + (keys.length - 1) + ' weitere';
}

// the first line of a message, null while its text is not loaded
function pv_preview(box, m) {
    if (box === 'in' && m.text_comment)
        return 'Rückmeldung: ' + pv_html_text(m.text_comment);
    if (box === 'in' && m.audio_comment_tag)
        return 'Audio-Rückmeldung, ' + duration_to_str((m.duration || 0) / 1000);
    if (!m.mid)
        return '';
    return pv_text(m.mid);
}

function pv_hash(box, key) {
    if (box === 'out')
        return key ? '#gesendet/' + encodeURIComponent(key) : '#gesendet';
    return key ? '#nachricht/' + encodeURIComponent(key) : '';
}

function pv_parse_hash() {
    let match = /^#(nachricht|gesendet)(?:\/(.+))?$/.exec(window.location.hash);
    if (!match)
        return {box: 'in', key: null};
    let box = (match[1] === 'gesendet' && PV_CAN_WRITE) ? 'out' : 'in';
    let key = null;
    try { key = match[2] ? decodeURIComponent(match[2]) : null; } catch (e) { key = null; }
    return {box: box, key: key};
}

function pv_set_url(box, key, push) {
    let url = window.location.pathname + window.location.search + pv_hash(box, key);
    if (push)
        history.pushState({pv_mail: true, pushed: true}, '', url);
    else
        history.replaceState({pv_mail: true, pushed: !!(history.state && history.state.pushed && key)}, '', url);
}

function pv_container(box) {
    return $(box === 'in' ? '.messages-container-inbox' : '.messages-container-outbox');
}

function pv_row(box, m) {
    let key = pv_key(box, m);
    let unread = (box === 'in') && pv.unread[key];
    let row = $('<a>').addClass('pv-mrow').attr('href', pv_hash(box, key) || '#nachricht/' + key);
    row[0].dataset.key = key;
    if (unread)
        row.addClass('pv-unread');
    if (pv.open && pv.open.box === box && pv.open.key === key)
        row.addClass('pv-selected').attr('aria-current', 'true');
    row.append($('<span>').addClass('pv-mrow-dot').attr('aria-hidden', 'true'));
    if (box === 'in')
        row.append(pv_avatar(m.from_email));
    let main = $('<span>').addClass('pv-mrow-main');
    let top = $('<span>').addClass('pv-mrow-top');
    let name = $('<span>').addClass('pv-mrow-name');
    if (unread)
        name.append($('<span>').addClass('sr-only pv-sr-unread').text('Ungelesen: '));
    name.append(document.createTextNode(box === 'in' ? (m.from || '') : pv_sent_summary(m)));
    top.append(name);
    let ts = pv_ts(m);
    top.append($('<time>').addClass('pv-mrow-time').attr('datetime', new Date(ts * 1000).toISOString()).text(pv_row_time(ts)));
    main.append(top);
    let preview = pv_preview(box, m);
    main.append($('<span>').addClass('pv-mrow-preview').text(preview === null ? ' ' : preview));
    row.append(main);
    if (preview === null) {
        row[0].dataset.mid = m.mid;
        pv.preview_observer.observe(row[0]);
    }
    return row;
}

function pv_empty(box, searching) {
    let div = $('<div>').addClass('pv-mail-empty');
    if (searching) {
        div.append($('<p>').addClass('pv-mail-empty-title').text('Keine Treffer'));
        div.append($('<p>').text('Gesucht wird in Namen und im Text der Nachrichten, die schon geladen sind.'));
    } else if (box === 'in') {
        div.append($('<p>').addClass('pv-mail-empty-title').text('Noch keine Nachrichten'));
        div.append($('<p>').text('Nachrichten und Rückmeldungen aus dem Unterricht erscheinen hier.'));
    } else {
        div.append($('<p>').addClass('pv-mail-empty-title').text('Noch keine Nachrichten gesendet'));
        div.append($('<p>').text('Mit »Neue Nachricht« schreiben Sie an Personen, Klassen oder Gruppen.'));
    }
    return div;
}

function pv_matches(box, m, terms) {
    let hay = (box === 'in') ? (m.from || '') : pv_sent_keys(m).map(pv_label).join(' ');
    let text = pv_preview(box, m);
    if (text)
        hay += ' ' + text;
    hay = hay.toLowerCase();
    return terms.every(function(t) { return hay.indexOf(t) >= 0; });
}

// the list of a box from the start (after loading, a change or the search)
function pv_render(box) {
    let items = pv.items[box];
    if (items === null)
        return;
    let container = pv_container(box);
    let terms = pv.query.toLowerCase().split(/\s+/).filter(function(t) { return t.length > 0; });
    pv.list[box] = (terms.length > 0) ? items.filter(function(m) { return pv_matches(box, m, terms); }) : items;
    pv.rendered_query[box] = pv.query;
    pv.shown[box] = 0;
    pv.group[box] = null;
    container.find('.pv-mrow').each(function(i, el) { pv.preview_observer.unobserve(el); });
    container.find('.pv-mail-rows').empty();
    container.find('.pv-mail-empty').remove();
    if (pv.list[box].length === 0)
        container.find('.pv-mail-rows').after(pv_empty(box, terms.length > 0));
    pv_more(box);
}

// the next rows of a box
function pv_more(box) {
    let container = pv_container(box);
    let rows = container.find('.pv-mail-rows');
    let list = pv.list[box];
    let end = Math.min(list.length, pv.shown[box] + PV_CHUNK);
    for (let i = pv.shown[box]; i < end; i++) {
        let group = pv_group(pv_ts(list[i]));
        if (group !== pv.group[box]) {
            pv.group[box] = group;
            rows.append($('<h3>').addClass('pv-mgroup').text(group));
        }
        rows.append(pv_row(box, list[i]));
    }
    pv.shown[box] = end;
    let more = container.find('.pv-mail-more')[0];
    more.hidden = (end >= list.length);
    // observed anew: the observer reports it again if it is still in view
    pv.more_observer.unobserve(more);
    if (!more.hidden)
        pv.more_observer.observe(more);
}

function pv_update_count() {
    let n = (pv.items.in || []).filter(function(m) { return pv.unread[pv_key('in', m)]; }).length;
    $('#bu-inbox .pv-seg-count').text(n > 0 ? ', ' + n + ' neu' : '');
}

function pv_switch(box) {
    pv.box = box;
    $('#bu-inbox').toggleClass('btn-primary', box === 'in').toggleClass('btn-outline-secondary', box !== 'in').attr('aria-pressed', box === 'in' ? 'true' : 'false');
    $('#bu-outbox').toggleClass('btn-primary', box === 'out').toggleClass('btn-outline-secondary', box !== 'out').attr('aria-pressed', box === 'out' ? 'true' : 'false');
    $('.messages-container-inbox').toggle(box === 'in');
    $('.messages-container-outbox').toggle(box === 'out');
    if (pv.rendered_query[box] !== pv.query)
        pv_render(box);
}

function pv_hint() {
    $('.pv-mail-reader').empty().append($('<div>').addClass('pv-read-hint')
        .append($('<i>').addClass('fa fa-envelope-open-o').attr('aria-hidden', 'true'))
        .append($('<p>').text('Keine Nachricht ausgewählt')));
}

function pv_mark_selected() {
    $('.pv-mrow.pv-selected').removeClass('pv-selected').removeAttr('aria-current');
    if (!pv.open)
        return;
    pv_container(pv.open.box).find('.pv-mrow').filter(function(i, el) { return el.dataset.key === pv.open.key; })
        .addClass('pv-selected').attr('aria-current', 'true').removeClass('pv-unread').find('.pv-sr-unread').remove();
}

// the opened message: sender (or recipients), time, the text, what one can do
function pv_render_reader(box, m) {
    let key = pv_key(box, m);
    let reader = $('.pv-mail-reader').empty();
    let back = $('<button>').attr({type: 'button', 'aria-label': 'Zurück zur Liste'}).addClass('pv-read-back')
        .append($('<i>').addClass('fa fa-arrow-left').attr('aria-hidden', 'true'))
        .append($('<span>').text(box === 'in' ? 'Eingang' : 'Gesendet'));
    back.on('click', function() { pv_close(); });
    reader.append($('<div>').addClass('pv-read-bar').append(back));
    let article = $('<article>').addClass('text-comment pv-read').attr('tabindex', '-1');
    let head = $('<header>').addClass('pv-read-head');
    let who = $('<div>').addClass('pv-read-who');
    let ts = pv_ts(m);
    let time = $('<time>').addClass('pv-read-time').attr('datetime', new Date(ts * 1000).toISOString()).text(pv_full_time(ts));
    if (box === 'in') {
        head.append(pv_avatar(m.from_email).addClass('pv-read-avatar'));
        who.append($('<h3>').addClass('pv-read-name').text(m.from || ''));
        let to = m.text_comment ? 'Rückmeldung aus dem Unterricht' : (m.audio_comment_tag ? 'Audio-Rückmeldung aus dem Unterricht' : 'an mich');
        who.append($('<p>').addClass('pv-read-to').text(to));
    } else {
        who.append($('<h3>').addClass('pv-read-name').text(pv_sent_summary(m)));
        let keys = pv_sent_keys(m);
        if (keys.length > 1) {
            let chips = $('<p>').addClass('pv-read-chips');
            let shown = keys.length > 12 ? keys.slice(0, 10) : keys;
            for (let k of shown)
                chips.append($('<span>').addClass('recipient').text(pv_label(k)));
            if (shown.length < keys.length) {
                let rest = $('<button>').attr('type', 'button').addClass('pv-read-all').text('alle ' + keys.length + ' zeigen');
                rest.on('click', function(e) {
                    $(e.currentTarget).remove();
                    for (let k of keys.slice(shown.length))
                        chips.append($('<span>').addClass('recipient').text(pv_label(k)));
                });
                chips.append(rest);
            }
            who.append(chips);
        }
    }
    who.append(time);
    head.append(who);
    article.append(head);
    if (box === 'in' && m.text_comment) {
        article.append($('<div>').addClass('message').html(m.text_comment));
    } else if (box === 'in' && m.audio_comment_tag) {
        article.append(create_audio_player(m.from, m.audio_comment_tag, m.duration / 1000).addClass('pv-audio'));
    } else if (m.mid) {
        let body = $('<div>').addClass('message pv-read-loading')
            .append($('<i>').addClass('fa fa-spinner fa-spin').attr('aria-hidden', 'true'))
            .append($('<span>').addClass('sr-only').text('Wird geladen'));
        article.append(body);
        pv_load_body(m.mid, function(html) {
            body.removeClass('pv-read-loading');
            if (html === null)
                body.empty().append($('<p>').addClass('pv-read-error').text('Die Nachricht konnte nicht geladen werden.'));
            else
                body.html(html);
        });
    }
    reader.append($('<div>').addClass('pv-read-scroll').append(article));
    let actions = $('<div>').addClass('pv-read-actions');
    if (box === 'in' && m.mid && PV_CAN_REPLY) {
        let reply = $('<button>').attr({type: 'button', id: 'bu_pv_reply'}).addClass('btn pv-read-reply')
            .append($('<i>').addClass('fa fa-reply').attr('aria-hidden', 'true'))
            .append($('<span>').text('Antworten'));
        reply.on('click', function() { compose_message(m.from_email); });
        actions.append(reply);
    }
    if (box === 'out') {
        let del = $('<button>').attr({type: 'button', id: 'bu_pv_delete'}).addClass('btn pv-read-delete')
            .append($('<i>').addClass('fa fa-trash').attr('aria-hidden', 'true'))
            .append($('<span>').text('Löschen'));
        del.on('click', function() {
            dashboardConfirm('Die Nachricht verschwindet auch bei allen Empfängern.', function() {
                pv_delete_sent(m.mid);
            }, {title: 'Nachricht löschen?', confirm: 'Löschen', danger: true});
        });
        let edit = $('<button>').attr({type: 'button', id: 'bu_pv_edit'}).addClass('btn pv-read-edit')
            .append($('<i>').addClass('fa fa-pencil').attr('aria-hidden', 'true'))
            .append($('<span>').text('Bearbeiten'));
        edit.on('click', function() {
            pv_load_body(m.mid, function(html) {
                if (html !== null)
                    edit_sent_message(m);
            });
        });
        actions.append(del, edit);
    }
    if (actions.children().length > 0)
        reader.append(actions);
    reader.toggleClass('pv-read-has-actions', actions.children().length > 0);
}

// shows a message (or the list) as the address says
function pv_apply(state) {
    if (state.box !== pv.box)
        pv_switch(state.box);
    let m = state.key ? pv_find(state.box, state.key) : null;
    let was_open = pv.open;
    if (m) {
        pv.open = {box: state.box, key: state.key};
        if (state.box === 'in' && pv.unread[state.key]) {
            delete pv.unread[state.key];
            pv_update_count();
        }
        pv_render_reader(state.box, m);
        pv_mark_selected();
        $('.pv-mail').addClass('pv-reading');
        $('body').addClass('pv-mail-reading');
    } else {
        if (state.key)
            pv_set_url(state.box, null, false);
        pv.open = null;
        pv_mark_selected();
        $('.pv-mail').removeClass('pv-reading');
        $('body').removeClass('pv-mail-reading');
        pv_hint();
        // narrow screens: back in the list where one was, on the row one had opened
        if (was_open && !pv.two) {
            if (pv_in_place())
                window.scrollTo(0, pv.scroll);
            let row = pv_container(was_open.box).find('.pv-mrow').filter(function(i, el) { return el.dataset.key === was_open.key; });
            if (row.length > 0)
                row[0].focus({preventScroll: true});
        }
    }
}

// tablets: the message takes the list's place (phones: it lies above the list)
function pv_in_place() {
    return !pv.two && window.matchMedia('(min-width: 768px)').matches;
}

function pv_open(box, key) {
    if (!pv.two)
        pv.scroll = window.scrollY;
    // narrow screens: an entry in the history, so that "back" closes the message
    let push = !pv.two && !pv.open;
    pv_set_url(box, key, push);
    pv_apply({box: box, key: key});
    if (!pv.two) {
        if (pv_in_place())
            $('.pv-mail')[0].scrollIntoView({block: 'start'});
        let article = $('.pv-mail-reader .pv-read')[0];
        if (article)
            article.focus({preventScroll: true});
    }
}

function pv_close() {
    if (history.state && history.state.pv_mail && history.state.pushed) {
        history.back();
        return;
    }
    pv_set_url(pv.box, null, false);
    pv_apply({box: pv.box, key: null});
}

// once both lists are there: the message from the address
function pv_ready() {
    if (pv.want === null || pv.items[pv.want.box] === null)
        return;
    let state = pv.want;
    pv.want = null;
    pv_apply(state);
}

function pv_inbox_loaded(messages) {
    pv.items.in = messages;
    pv_update_count();
    pv_render('in');
    pv_ready();
}

// the sent messages changed (loaded, sent, edited, deleted)
function pv_sent_changed() {
    pv.sent_keys = {};
    let now = Math.floor(Date.now() / 1000);
    for (let m of sent_messages) {
        if (!m.timestamp)
            m.timestamp = pv.sent_ts[m.mid] || now;
        pv.sent_ts[m.mid] = m.timestamp;
    }
    pv.items.out = sent_messages;
    pv_render('out');
    if (pv.open && pv.open.box === 'out') {
        let m = pv_find('out', pv.open.key);
        if (m) {
            pv_render_reader('out', m);
            pv_mark_selected();
        } else {
            pv_close();
        }
    }
    pv_ready();
}

function pv_delete_sent(mid) {
    api_call('/api/delete_message', {mid: mid}, function(data) {
        if (data.success) {
            sent_messages = sent_messages.filter(x => x.mid !== data.mid);
            update_sent_messages();
        }
    });
}

function pv_setup() {
    for (let id of pv_messages.new_ids || [])
        pv.unread[String(id)] = true;
    pv.want = pv_parse_hash();
    pv.preview_observer = new IntersectionObserver(function(entries) {
        for (let entry of entries) {
            if (!entry.isIntersecting)
                continue;
            pv.preview_observer.unobserve(entry.target);
            let row = entry.target;
            pv_load_body(row.dataset.mid, function(html) {
                let text = (html === null) ? '' : pv_text(row.dataset.mid);
                $(row).find('.pv-mrow-preview').text(text || ' ');
            });
        }
    }, {rootMargin: '200px'});
    pv.more_observer = new IntersectionObserver(function(entries) {
        for (let entry of entries) {
            if (entry.isIntersecting && !entry.target.hidden)
                pv_more($(entry.target).closest('.messages-container-inbox').length > 0 ? 'in' : 'out');
        }
    }, {rootMargin: '600px'});
    $('.bu_pv_more').on('click', function(e) {
        pv_more($(e.currentTarget).closest('.messages-container-inbox').length > 0 ? 'in' : 'out');
    });
    // side by side from PV_TWO_PANES on
    let mail = $('.pv-mail')[0];
    let measure = function() {
        let two = mail.getBoundingClientRect().width >= PV_TWO_PANES;
        if (two !== pv.two) {
            pv.two = two;
            $(mail).toggleClass('pv-two', two);
        }
    };
    measure();
    new ResizeObserver(measure).observe(mail);
    pv_switch(pv.want.box);
    pv_hint();

    $('#bu-inbox, #bu-outbox').on('click', function(e) {
        let box = (e.currentTarget.id === 'bu-inbox') ? 'in' : 'out';
        if (box === pv.box)
            return;
        pv_set_url(box, null, false);
        pv_apply({box: box, key: null});
    });
    $('.pv-mail-list').on('click', '.pv-mrow', function(e) {
        // with a modifier: a new tab or window, as with any link
        if (e.ctrlKey || e.metaKey || e.shiftKey || e.altKey || e.button !== 0)
            return;
        e.preventDefault();
        let key = e.currentTarget.dataset.key;
        if (pv.open && pv.open.box === pv.box && pv.open.key === key)
            return;
        pv_open(pv.box, key);
    });
    // arrow keys walk through the rows (side by side: the message follows)
    $('.pv-mail-list').on('keydown', '.pv-mrow', function(e) {
        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp')
            return;
        let rows = pv_container(pv.box).find('.pv-mrow');
        let i = rows.index(e.currentTarget) + (e.key === 'ArrowDown' ? 1 : -1);
        if (i >= rows.length && pv.shown[pv.box] < pv.list[pv.box].length) {
            pv_more(pv.box);
            rows = pv_container(pv.box).find('.pv-mrow');
        }
        e.preventDefault();
        if (i < 0 || i >= rows.length)
            return;
        rows[i].focus();
        if (pv.two)
            pv_open(pv.box, rows[i].dataset.key);
    });
    // Escape closes the opened message on narrow screens (not under a dialog)
    $(document).on('keydown', function(e) {
        if (e.key === 'Escape' && pv.open && !pv.two && $('.modal.show').length === 0) {
            e.preventDefault();
            pv_close();
        }
    });
    // only the page's own entries (a link to "#" elsewhere makes one too)
    history.replaceState({pv_mail: true, pushed: false}, '', window.location.href);
    window.addEventListener('popstate', function(e) {
        if (pv.want === null && e.state && e.state.pv_mail)
            pv_apply(pv_parse_hash());
    });
    let timer = null;
    $('#ti_pv_search').on('input', function(e) {
        clearTimeout(timer);
        let value = e.currentTarget.value;
        timer = setTimeout(function() {
            pv.query = value.trim();
            pv_render(pv.box);
        }, 120);
    });
}

function can_send() {
    return (net_recipients_list.length > 0) && $($('#summernote').summernote('code')).text().trim().length > 0;
}

function pending_changes() {
    return (old_recipients_list.join('/') !== net_recipients_list.join('/')) || (old_message !== $('#summernote').summernote('code'));
}

function update_buttons() {
    if (old_mid) {
        $('#bu_delete_message').prop('disabled', false).show().removeClass('btn-outline-secondary').addClass('btn-danger');
        // new design: the title says "Nachricht bearbeiten", short labels keep the buttons in one row
        $('#bu_discard_message span').html(PV_MESSAGES ? 'Verwerfen' : 'Änderungen verwerfen');
        $('#bu_send_message span').html(PV_MESSAGES ? 'Speichern' : 'Änderungen speichern');
    } else {
        $('#bu_delete_message').prop('disabled', true).hide().addClass('btn-outline-secondary').removeClass('btn-danger');
        $('#bu_discard_message span').html('Verwerfen');
        $('#bu_send_message span').html('Senden');
    }
    if (pending_changes()) {
        $('#bu_discard_message').removeClass('btn-outline-secondary').addClass('btn-secondary').prop('disabled', false);
        $('#bu_close_message_modal').removeClass('btn-secondary').addClass('btn-outline-secondary').prop('disabled', true);
        if (can_send())
            $('#bu_send_message').removeClass('btn-outline-secondary').addClass('btn-success').prop('disabled', false);
        else
            $('#bu_send_message').removeClass('btn-success').addClass('btn-outline-secondary').prop('disabled', true);
    } else {
        $('#bu_discard_message').removeClass('btn-secondary').addClass('btn-outline-secondary').prop('disabled', true);
        $('#bu_close_message_modal').removeClass('btn-outline-secondary').addClass('btn-secondary').prop('disabled', false);
        $('#bu_send_message').removeClass('btn-success').addClass('btn-outline-secondary').prop('disabled', true);
    }
}

function discard_message() {
    force_close = true;
    $('#composeModal').modal('hide');
}

function send_message() {
    let message = $('#summernote').summernote('code');
    if (old_mid === null) {
        api_call('/api/send_message', {recipients: net_recipients_list, message: message}, function(data) {
            if (data.success) {
                sent_messages.unshift(data.message);
                force_close = true;
                $('#composeModal').modal('hide');
                update_sent_messages();
                $('#bu-outbox').click();
            }
        });
    } else {
        api_call('/api/update_message', {mid: old_mid, recipients: net_recipients_list, message: message}, function(data) {
            if (data.success) {
                message_cache[data.mid] = message;
                sent_messages = sent_messages.map(function(m) {
                    if (m.mid === data.mid)
                        m = data.message;
                    return m;
                });
                force_close = true;
                $('#composeModal').modal('hide');
                update_sent_messages();
                $('#bu-outbox').click();
            }
        });
    }
}

function delete_message() {
    if (!old_mid)
        return;
    api_call('/api/delete_message', {mid: old_mid}, function(data) {
        if (data.success) {
            old_recipients_list = net_recipients_list;
            old_message = $('#summernote').summernote('code');
            $('#composeModal').modal('hide');
            sent_messages = sent_messages.filter(x => x.mid !== data.mid);
            update_sent_messages();
        }
    });
}

function update_net_recipients_list() {
    let net_recipients_hash = {};
    for (let key in recipients_list) {
        let entry = recipients[key];
        if (entry.entries)
            for (let email of entry.entries)
                net_recipients_hash[email] = true;
        else
            net_recipients_hash[key] = true;
    }
    net_recipients_list = Object.keys(net_recipients_hash).sort();
    if (net_recipients_list.length === 0)
        $('#recipient_count').html('keine Empfänger');
    else
        $('#recipient_count').html('' + net_recipients_list.length + ' Empfänger');
    if (PV_MESSAGES)
        $('#ti_recipients').attr('placeholder', Object.keys(recipients_list).length === 0 ? 'Name, Klasse oder Gruppe suchen …' : 'Weitere hinzufügen …');
    update_buttons();
}

function gen_recipient_span(key, with_rm) {
    if (!(key in recipients))
        recipients[key] = {label: key};
    let label = recipients[key].label;
    if (recipients[key].entries)
        label += ' (' + recipients[key].entries.length + ')';
    let recipient = $('<span>').addClass('recipient').html(label);
    if (with_rm) {
        let rm_button = $('<span>').addClass('rm').data('key', key);
        rm_button.click(function(e) {
            remove_recipient($(e.currentTarget).data('key'));
            $(e.currentTarget).closest('.recipient').remove();
            if (PV_MESSAGES)
                $('#ti_recipients').focus();
        });
        if (PV_MESSAGES) {
            rm_button.attr({role: 'button', tabindex: '0', 'aria-label': recipients[key].label + ' entfernen'});
            rm_button.keydown(function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    $(e.currentTarget).click();
                }
            });
        }
        recipient.addClass('with-rm').append(rm_button);
    }
    if (recipients[key].teacher)
        recipient.addClass('teacher');
    recipient.data('key', key);
    return recipient;
}

function add_recipient(key) {
    if (!(key in recipients_list)) {
        recipients_list[key] = true;
        $('.recipients_list').append(gen_recipient_span(key, true));
    }
    $('.recipient-input-dropdown').hide();
    $('#ti_recipients').val('');
    $('#ti_recipients').focus();
    update_net_recipients_list();
}

function remove_recipient(key) {
    delete recipients_list[key];
    update_net_recipients_list();
}

function observer_callback(entries, observer) {
    for (let entry of entries) {
        if (entry.intersectionRatio === 0)
            continue;
        observer.unobserve(entry.target);
        let entry_data = $(entry.target).data();
        if (entry_data.mid) {
            (function(entry_data) {
                let request = new XMLHttpRequest();
                let uri = '/gen/m/' + entry_data.mid.substr(0, 2) + '/' + entry_data.mid.substr(2, entry_data.mid.length - 2) + '.html.gz';
                request.open('GET', uri, true);
                request.responseType = 'arraybuffer';

                request.onload = function(e) {
                    if (e.target.status === 200) {
                        let data = pako.ungzip(request.response);
                        let bb = new Blob([new Uint8Array(data)]);
                        let f = new FileReader();
                        f.onload = function(e) {
                            let contents = e.target.result;
                            message_cache[entry_data.mid] = contents;
                            if (entry_data.strip)
                                $(entry_data.msg_div).html($(contents).text());
                            else
                                $(entry_data.msg_div).html(contents);
                        };
                        f.readAsText(bb);
                    }
                };
                request.send();
            })(entry_data);
        }
    }
}

function compact_address_list(emails) {
    let result = [];
    for (let key of recipients_cache.groups) {
        if (recipients[key].entries.length === 0)
            continue;
        let all_in = true;
        for (let email of recipients[key].entries) {
            if (emails.indexOf(email) < 0) {
                all_in = false;
                break;
            }
        }
        if (all_in) {
            result.push(key);
            let new_emails = [];
            for (let email of emails)
                if (recipients[key].entries.indexOf(email) < 0)
                    new_emails.push(email);
            emails = new_emails;
        }
    }
    for (let email of emails)
        result.push(email);
    return result;
}

// opens a sent message for editing (recipients and text as sent)
function edit_sent_message(message) {
    let recipients = compact_address_list(message.recipients);
    $('#summernote').summernote('reset');
    $('#summernote').summernote('code', message_cache[message.mid]);
    $('.recipients_list').empty();
    recipients_list = {};
    for (let email of recipients) {
        recipients_list[email] = true;
        $('.recipients_list').append(gen_recipient_span(email, true));
    }
    update_net_recipients_list();
    if (PV_MESSAGES)
        $('#composeModal > .modal-dialog > .modal-content > .modal-header > .modal-title').text('Nachricht bearbeiten');
    $('#composeModal').modal('show');
    force_close = false;
    old_recipients_list = [...net_recipients_list];
    old_message = $('#summernote').summernote('code');
    old_mid = message.mid;
    $('#ti_recipients').val('');
    $('#ti_recipients').focus();
    update_buttons();
}

function update_sent_messages() {
    if (PV_MESSAGES) {
        pv_sent_changed();
        return;
    }
    $('.outbox-messages-here').empty();
    for (message of sent_messages) {
        let row = $('<tr>');
        row.append($('<td>').html(weekdays[message.dow] + '. ' + message.date.substr(8, 2) + '.' + message.date.substr(5, 2) + '.' + message.date.substr(0, 4)));
        let cell = $('<td>');
        let recipients = compact_address_list(message.recipients);
        for (email of recipients)
            cell.append(gen_recipient_span(email), false);
        row.append(cell);
        let msg_div = $('<td>').html("<i class='fa fa-spinner fa-spin'></i>");
        row.append(msg_div);
        if (message.mid in message_cache) {
            msg_div.html(message_cache[message.mid]);
        } else {
            msg_div.data('mid', message.mid);
            msg_div.data('msg_div', msg_div[0]);
            msg_div.data('strip', true);
            observer.observe(msg_div[0]);
        }
        (function(message) {
            row.click(function(e) {
                edit_sent_message(message);
            });
        })(message);
        $('.outbox-messages-here').append(row);
    };
}

function compose_message(to) {
    if (PV_MESSAGES)
        $('#composeModal > .modal-dialog > .modal-content > .modal-header > .modal-title').text(typeof(to) === 'undefined' ? 'Neue Nachricht' : 'Antworten');
    $('#summernote').summernote('reset');
    recipients_list = {};
    $('.recipients_list').empty();
    update_net_recipients_list();
    if (typeof(to) !== 'undefined') {
        add_recipient(to);
        setTimeout(function() {
            $('#summernote').summernote('focus');
        }, 0);
    }
    $('#composeModal').modal('show');
    force_close = false;
    old_recipients_list = [];
    old_message = $('#summernote').summernote('code');
    old_mid = null;
    $('#ti_recipients').val('');
    $('#ti_recipients').focus();
    update_buttons();
}

document.addEventListener('DOMContentLoaded', function() {
    observer = new IntersectionObserver(observer_callback, {
        rootMargin: '100px',
        threshold: 1.0
    });
    if (PV_MESSAGES)
        pv_setup();

    // keeps p, br, b/strong, i/em, u, a (href), ul/ol/li and drops all styles
    function clean_pasted_html(html) {
        let source = new DOMParser().parseFromString(html, 'text/html').body;
        let keep = { P: 'p', DIV: 'p', BR: 'br', B: 'b', STRONG: 'b', I: 'i', EM: 'i', U: 'u', A: 'a', UL: 'ul', OL: 'ol', LI: 'li', H1: 'p', H2: 'p', H3: 'p', H4: 'p' };
        let copy = function(node, target) {
            for (let child of Array.from(node.childNodes)) {
                if (child.nodeType === 3) { target.appendChild(document.createTextNode(child.textContent)); continue; }
                if (child.nodeType !== 1 || /^(SCRIPT|STYLE|META|LINK|TITLE)$/.test(child.tagName)) continue;
                let tag = keep[child.tagName];
                // bold written as a style (Word, Google Docs)
                if (!tag && /font-weight:\s*(bold|[6-9]00)/i.test(child.getAttribute('style') || '')) tag = 'b';
                if (!tag) { copy(child, target); continue; }
                let el = document.createElement(tag);
                if (tag === 'a') {
                    let href = child.getAttribute('href') || '';
                    if (/^(https?:|mailto:)/i.test(href)) el.setAttribute('href', href); else { copy(child, target); continue; }
                }
                if (/^H[1-4]$/.test(child.tagName)) { let b = document.createElement('b'); copy(child, b); el.appendChild(b); }
                else copy(child, el);
                target.appendChild(el);
            }
        };
        let out = document.createElement('div');
        copy(source, out);
        // no empty paragraphs one after another
        out.innerHTML = out.innerHTML.replace(/(<p>\s*(<br>)?\s*<\/p>\s*){2,}/g, '<p><br></p>');
        return out.innerHTML;
    }

    $('#summernote').summernote({
        placeholder: PV_MESSAGES ? 'Nachricht schreiben …' : 'Bitte geben Sie Ihre Nachricht ein',
        callbacks: {
            onChange: function() {
                update_buttons();
            },
            // new design: pasted text keeps its structure (paragraphs, bold,
            // italics, links, lists), not its fonts, sizes and colours
            onPaste: function(e) {
                if (!document.body.classList.contains('ui-preview')) return;
                let data = (e.originalEvent || e).clipboardData;
                if (!data) return;
                let html = data.getData('text/html');
                let text = data.getData('text/plain');
                e.preventDefault();
                $('#summernote').summernote('pasteHTML', html ? clean_pasted_html(html) : $('<div>').text(text).html().replace(/\n/g, '<br>'));
            }
        },
        lang: 'de-DE',
        height: PV_MESSAGES ? 240 : 300,
        // new design: the link dialog as a dialog of its own, not nested in
        // the compose sheet
        dialogsInBody: PV_MESSAGES,
        // new design: messages are shown in the design's own type, so only
        // what survives that (bold, italics, lists, links)
        toolbar: PV_MESSAGES ? [
            ['font', ['bold', 'italic', 'underline', 'clear']],
            ['para', ['ul', 'ol']],
            ['insert', ['link']],
        ] : [
            ['style', ['style']],
            ['font', ['bold', 'underline', 'clear']],
            ['fontname', ['fontname']],
            ['fontsize', ['fontsize']],
            ['color', ['color']],
            ['para', ['ul', 'ol', 'paragraph']],
            ['table', ['table']],
            ['insert', ['link']],
            ['view', ['codeview', 'help']],
        ],
    });

    // a confirmation on top must not leave the dialog below it unscrollable
    if (PV_MESSAGES) {
        $(document).on('hidden.bs.modal', '#__template_modal', function() {
            if ($('#composeModal').hasClass('show'))
                $('body').addClass('modal-open');
        });
    }

    $('#composeModal').on('hide.bs.modal', function(e) {
        if ($(e.target).attr('id') === 'composeModal' && pending_changes() && (!force_close)) {
            // new design: ask instead of shaking the buttons (on phones the
            // sheet is pulled down without looking at them)
            if (PV_MESSAGES) {
                if (!$('#__template_modal').hasClass('show'))
                    dashboardConfirm(old_mid ? 'Die Änderungen an dieser Nachricht gehen verloren.' : 'Der Text und die Empfänger gehen verloren.', function() {
                        discard_message();
                    }, {title: old_mid ? 'Änderungen verwerfen?' : 'Nachricht verwerfen?', confirm: 'Verwerfen', cancel: 'Weiter bearbeiten', danger: true});
            } else
                $('#publish_message_btn_container').effect('shake', {direction: 'left', distance: 4});
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
        }
    });

    $('.bu-compose').click(function(e) {
        compose_message();
    });

    $('#bu_discard_message').click(function(e) {
        discard_message();
    });

    $('#bu_send_message').click(function(e) {
        send_message();
    });

    $('#bu_delete_message').click(function(e) {
        showTemplateModal('Nachricht löschen',
            'Sind Sie sicher, dass Sie diese Nachricht löschen möchten?',
            "<i class='fa fa-trash'></i>&nbsp;&nbsp;Nachricht löschen", 'btn-danger',
            'Abbrechen', 'btn-secondary', function() {
                delete_message();
            }
        );
    });

    $('#bu-inbox').click(function(e) {
        $('#bu-inbox').removeClass('btn-outline-secondary').addClass('btn-primary');
        $('#bu-outbox').removeClass('btn-primary').addClass('btn-outline-secondary');
        $('.messages-container-inbox').show();
        $('.messages-container-outbox').hide();
    });

    $('#bu-outbox').click(function(e) {
        $('#bu-outbox').removeClass('btn-outline-secondary').addClass('btn-primary');
        $('#bu-inbox').removeClass('btn-primary').addClass('btn-outline-secondary');
        $('.messages-container-outbox').show();
        $('.messages-container-inbox').hide();
    });

    // new design: arrow keys walk through the suggestions, Enter takes the
    // chosen one, Escape closes them, Backspace in the empty field removes
    // the last recipient
    function pv_recipient_key(e) {
        let dropdown = $('.recipient-input-dropdown');
        let items = dropdown.find('.recipient');
        let open = dropdown.is(':visible') && items.length > 0;
        let active = items.filter('.pv-active');
        if (open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
            let i = items.index(active);
            i = (e.key === 'ArrowDown') ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1);
            items.removeClass('pv-active').attr('aria-selected', 'false');
            let next = items.eq(i).addClass('pv-active').attr('aria-selected', 'true');
            next[0].scrollIntoView({block: 'nearest'});
            e.preventDefault();
            return true;
        }
        if (open && e.key === 'Enter' && active.length > 0) {
            e.preventDefault();
            add_recipient(active.data('key'));
            return true;
        }
        if (open && e.key === 'Escape') {
            // closes the suggestions, not the dialog
            dropdown.hide();
            e.preventDefault();
            e.stopPropagation();
            return true;
        }
        if (e.key === 'Backspace' && $(e.currentTarget).val() === '') {
            let last = $('.recipients_list .recipient').last();
            if (last.length > 0) {
                remove_recipient(last.data('key'));
                last.remove();
                e.preventDefault();
                return true;
            }
        }
        return false;
    }

    $('#ti_recipients').keydown(function(e) {
        if (PV_MESSAGES && pv_recipient_key(e))
            return;
        if ((e.keyCode === 9 || e.keyCode === 13) && ($(e.target).val().length > 0)) {
            if (Object.keys(autocomplete_results).length === 1) {
                let key = recipients_cache.keys[Object.keys(autocomplete_results)[0]];
                add_recipient(key);
            }
            e.preventDefault();
            e.stopPropagation();
            return;
        }
    });
    $('#ti_recipients').keyup(function(e) {
        if (PV_MESSAGES && ['ArrowDown', 'ArrowUp', 'Escape'].indexOf(e.key) >= 0)
            return;
        if ($('#ti_recipients')[0].selectionStart == $(e.target).val().length) {
            let value = $(e.target).val();
            let backspace_pressed = (e.keyCode === 8);
            let space_at_end = value[value.length - 1] == ' ';
            let search_terms = value.trim().toLowerCase().split(/\s+/);
            let results = {};
            for (let i = 0; i < search_terms.length; i++) {
                let term = search_terms[i];
                let term_results = {};
                for (let key of Object.keys(recipients_cache.index[term] || {})) {
                    term_results[key] = recipients_cache.index[term][key];
                }
                if (i == 0)
                    results = term_results;
                else {
                    for (let k of Object.keys(results)) {
                        if (k in term_results) {
                            if (term_results[k] > results[k])
                                results[k] = term_results[k];
                        } else {
                            delete results[k];
                        }
                    }
                }
            }
            autocomplete_results = results;
            result_keys = Object.keys(results).map(function(x) { return parseInt(x); });
            if (result_keys.length === 0)
                $('.recipient-input-dropdown').hide();
            else {
                if (result_keys.length === 1)
                {
                    if (!backspace_pressed) {
                        let key = recipients_cache.keys[result_keys[0]];
                        let label = recipients[key].label;
                        $('#ti_recipients').val(label);
                        $('#ti_recipients')[0].setSelectionRange(results[result_keys[0]] + (space_at_end ? 1 : 0), label.length);
                    }
                }
                result_keys.sort(function(a, b) {
                    let va = recipients[recipients_cache.keys[a]];
                    let vb = recipients[recipients_cache.keys[b]];
                    if (va.teacher === vb.teacher) {
                        if (va.label < vb.label)
                            return -1;
                        return 1;
                    } else {
                        if (va.teacher)
                            return -1;
                        return 1;
                    }
                });
                $('.recipient-input-dropdown').empty();
                for (let key of result_keys) {
                    let k = recipients_cache.keys[key];
                    let r = gen_recipient_span(k);
                    if (PV_MESSAGES)
                        r.attr({role: 'option', 'aria-selected': 'false'});
                    r.click(function(e) {
                        add_recipient($(e.currentTarget).data('key'));
                    });
                    $('.recipient-input-dropdown').append(r);
                }
                $('.recipient-input-dropdown').show();
            }
        }
    });
    let uri = '/gen/w/#{@session_user[:id]}/messages.json.gz';
    uri += '?' + Date.now();
    let oReq = new XMLHttpRequest();
    oReq.open('GET', uri, true);
    oReq.responseType = 'arraybuffer';

    oReq.onload = function(e) {
        if (e.target.status === 200) {
            let data = pako.ungzip(oReq.response);
            let bb = new Blob([new Uint8Array(data)]);
            let f = new FileReader();
            f.onload = function(e) {
                let messages = JSON.parse(e.target.result);
                messages = filter_events_by_timestamp(messages, show_messages_from);
                let old_date = null;
                if (PV_MESSAGES) {
                    pv_inbox_loaded(messages || []);
                    return;
                }
                if ((messages || []).length === 0)
                {
                    let comment = $('<p>').html('Keine Nachrichten gefunden!<br /><br />¯\\\_(ツ)_/¯');
                    $('.messages-container-inbox').append(comment);
                }
                for (let message of (messages || [])) {
                    if (message.date !== old_date) {
                        old_date = message.date;
                        let date_str = weekdays_long[message.dow] + ', den ' + message.date.substr(8, 2) + '.' + message.date.substr(5, 2) + '.' + message.date.substr(0, 4);
                        $('.messages-container-inbox').append($('<div>').addClass('messages-date').append($('<span>').html(date_str)));
                    }
                    let div = null;
                    if (message.text_comment) {
                        div = $('<div>').addClass('text-comment').append($('<div>').addClass('from').html(message.from)).append($('<div>').addClass('message').html(message.text_comment));
                    } else if (message.audio_comment_tag) {
                        div = create_audio_player(message.from, message.audio_comment_tag, message.duration / 1000);
                    } else if (message.mid) {
                        let msg_header = $('<div>').addClass('from');
                        let msg_buttons = $('<div>').addClass('buttons');
                        let reply_button = $('<button>').addClass('btn').addClass('btn-sm').addClass('btn-outline-secondary').html("<i class='fa fa-reply'></i>&nbsp;&nbsp;Antworten");
                        let toggle_mark_read_button = $('<button>').addClass('btn').addClass('btn-sm').addClass('btn-outline-secondary').html("<i class='fa fa-check'></i>&nbsp;&nbsp;Als gelesen markieren");
                        (function(to) {
                            reply_button.click(function(e) {
                                compose_message(to);
                            });
                        })(message.from_email);
                        if ('#{teacher_logged_in?}' === 'true') {
//                             msg_buttons.append(toggle_mark_read_button);
                            msg_buttons.append(reply_button);
                        }
                        msg_header.append(msg_buttons);
                        msg_header.append($('<span>').html(message.from));
                        let msg_div = $('<div>').addClass('message').html("<i class='fa fa-spinner fa-spin'></i>");
                        div = $('<div>').addClass('text-comment').append(msg_header).append(msg_div);
                        div.data('mid', message.mid);
                        div.data('msg_div', msg_div[0]);
                    }
                    $('.messages-container-inbox').append(div);
                    observer.observe(div[0]);
                }
            };
            f.readAsText(bb);
        } else if (PV_MESSAGES) {
            pv_inbox_loaded([]);
        }
    };
    oReq.send();
    if ('#{user_with_role_logged_in?(:can_write_messages)}' === 'true') {
        load_recipients('#{@session_user[:id]}', function() {
            update_sent_messages();
        });
    }
});
</script>
