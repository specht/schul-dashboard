#{this_is_a_page_for_logged_in_teachers}
<style>
    /* mails since one's last visit (print_email_overview) */
    .mail-overview-is-new {
        outline: 2px solid #d61f1f;
        outline-offset: 1px;
    }
    /* every mail in sight: the badges of a month wrap */
    .mail-overview-table td {
        overflow: visible;
        vertical-align: top;
    }
    .mail-overview-table td .badge {
        display: inline-block;
        margin: 0 3px 3px 0;
    }
    .mail-overview-new-mark {
        display: inline-block;
        width: 1.1em;
        height: 0.9em;
        border-radius: 0.2em;
        outline: 2px solid #d61f1f;
        vertical-align: -0.1em;
        margin-right: 0.3em;
    }
</style>
<div class='container-fluid white'>
    #{print_email_overview(klasse)}
</div>
