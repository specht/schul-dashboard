#{this_is_a_page_for_logged_in_admins}
<style>
    .pal-row { margin: 0 0 28px; }
    .pal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .pal-dots i { display: inline-block; width: 16px; height: 16px; border-radius: 50%; margin-right: 3px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15); }
    .pal-count { margin-left: auto; opacity: 0.7; font-variant-numeric: tabular-nums; }
    .pal-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
    .pal-card { background: var(--paper); color: var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.15); }
    .pal-band { height: 34px; background: linear-gradient(90deg, var(--band-left, transparent), transparent); background-color: var(--acc-soft); display: flex; align-items: center; padding: 0 12px; font-size: 12px; font-weight: 700; color: var(--acc-text); }
    .pal-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .pal-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .pal-btn { background: var(--acc); color: var(--acc-ink); border-radius: 10px; padding: 6px 12px; font-weight: 600; }
    .pal-chip { background: var(--acc-soft); color: var(--acc-text); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
    .pal-link { border: 1px solid rgba(127, 127, 127, 0.35); color: var(--acc-text); border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; }
    .pal-subjects { display: flex; flex-wrap: wrap; gap: 4px; }
    .pal-subjects span { color: var(--on-subject); border-radius: 7px; padding: 3px 7px; font-size: 12px; font-weight: 700; min-width: 34px; text-align: center; }
    .pal-agenda { display: grid; grid-template-columns: 42px 1fr; gap: 8px; align-items: start; }
    .pal-when { text-align: right; font-size: 12px; line-height: 1.2; padding-top: 8px; }
    .pal-when b, .pal-when span { display: block; }
    .pal-when span { opacity: 0.6; }
    .pal-lesson { display: flex; gap: 8px; align-items: center; background: var(--surface); border-radius: 10px; padding: 7px 9px; border-left: 4px solid var(--c); box-shadow: inset 0 0 0 1px rgba(127, 127, 127, 0.2); }
    .pal-lesson b, .pal-lesson small { display: block; }
    .pal-lesson small { opacity: 0.65; }
    .pal-subj { background: var(--c); color: var(--on-subject); border-radius: 8px; min-width: 32px; height: 30px; display: grid; place-items: center; font-weight: 800; font-size: 12px; padding: 0 5px; }
</style>
<div class='container'>
    <div class='row'>
        <div class='col-md-12'>
            <h2>Farbschemata im neuen Design</h2>
            <p>Alle Farbschemata, wie das neue Design sie heute aus den drei Farben ableitet – hell und dunkel. Grundlage für die neue, kuratierte Auswahl.</p>
            #{design_palettes_html}
        </div>
    </div>
</div>
