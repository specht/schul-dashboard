#{redirect_on_error { require_sitzplan_page!(*sitzplan_path_params) }}
<script>
// Von Hand verteilt wird jetzt auf der Sitzplan-Seite ("Neuer Sitzplan" ->
// "Von Hand" bzw. "Plan ändern"). Die alte Adresse leitet dorthin weiter,
// damit Lesezeichen weiter funktionieren.
var klasse = #{sitzplan_path_params[0].to_json};
var raum = #{sitzplan_path_params[1].to_json};
window.location.replace('/sitzplanhelfer/' + encodeURIComponent(klasse) + '/' + encodeURIComponent(raum));
</script>
