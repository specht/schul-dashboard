#{require_admin_or_sekretariat!}
<style>
    /* new design (public_events_overview): slots wrap instead of a column per slot */
    .pe-page h2 { margin-bottom: 0.6em; }
    .pe-event { padding-top: 0.6em; }
    .pe-event + .pe-event { margin-top: 1.6em; border-top: 1px solid var(--pv-line); padding-top: 1.4em; }
    .pe-facts { color: var(--pv-muted); margin-bottom: 0.8em; }
    .pe-row { display: flex; align-items: flex-start; gap: 0.6em 1.2em; padding: 0.7em 0; border-top: 1px solid var(--pv-line); }
    .pe-rows > .pe-row:last-child { border-bottom: 1px solid var(--pv-line); }
    .pe-day { flex: 0 0 11em; font-weight: 600; padding-top: 0.15em; }
    .pe-slots { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; gap: 0.5em 1.2em; }
    .pe-slot { width: 8.5em; }
    .pe-slot-head { display: flex; justify-content: space-between; gap: 0.5em; font-variant-numeric: tabular-nums; }
    .pe-count { color: var(--pv-muted); }
    .pe-full .pe-count { color: var(--pv-ink); font-weight: 600; }
    .pe-bar { height: 4px; margin-top: 4px; border-radius: 2px; background: var(--pv-hover); overflow: hidden; }
    .pe-bar > div { height: 100%; background: var(--acc); border-radius: 2px; }
    .pe-event h4 { margin-top: 1.4em; font-size: 1.05rem; font-weight: 600; }
    .pe-past { margin-top: 0.8em; }
    .pe-past > summary { cursor: pointer; color: var(--pv-muted); }
    .pe-past > .pe-rows, .pe-past > .pe-table { margin-top: 0.5em; }
    .pe-table { overflow-x: auto; }
    .pe-table table { width: auto; min-width: 100%; }
    .pe-table td, .pe-table th { vertical-align: top; }
    .pe-mail, .pe-when { white-space: nowrap; }
    .pe-actions { text-align: right; white-space: nowrap; }
    @media (max-width: 640px) {
        .pe-row { flex-direction: column; }
        .pe-day { flex: none; }
        .pe-slots { gap: 0.5em 1em; }
        .pe-slot { width: calc(50% - 0.5em); }
    }
</style>
#{ui_preview? ? "<div class='container-fluid white'>" + public_events_overview() + "</div>" : "<div class='container' style='padding-top: 30px; background-color: #fff;'><div>" + public_events_table() + "</div></div>"}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        install_clipboard_handler('.btn-clipboard');
        let remove = function(tag) {
            api_call('/api/delete_sign_up_for_event', {tag: tag}, function(data) {
                if (data.success)
                    window.location.reload();
            });
        };
        $('.bu-delete-signup').click(function(e) {
            let button = $(e.currentTarget);
            let tag = button.data('tag');
            if (document.body.classList.contains('ui-preview')) {
                dashboardConfirm(`Die Anmeldung von ${button.data('name')} löschen? Sag der Person Bescheid, dass sie nicht mehr angemeldet ist – sie hat schon eine Bestätigung bekommen.`,
                    function() { remove(tag); },
                    { title: 'Anmeldung löschen', confirm: 'Löschen', danger: true });
                return;
            }
            showTemplateModal('Anmeldung löschen',
                'Sind Sie sicher, dass Sie diese Anmeldung löschen möchten? Bitte denken Sie daran, die Person zu benachrichtigen, dass die Anmeldung aufgehoben wurde, denn es wurde bereits eine Anmeldebestätigung versendet.',
                "<i class='fa fa-trash'></i>&nbsp;&nbsp;Anmeldung löschen", 'btn-danger',
                'Abbrechen', 'btn-secondary', function () {
                    remove(tag);
                });
        });
    });
</script>
