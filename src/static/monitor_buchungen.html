#{require_monitor_or_user_who_can_manage_monitors!}
<style>
    body {
        color: #{color_palette[:contrast]};
        overflow: hidden;
    }

    .bm-wrapper {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 1vw;
        gap: 0.8vw;
        box-sizing: border-box;
    }

    .bm-card {
        background-color: rgba(255, 255, 255, 0.82);
        border-radius: 0.6vw;
        box-shadow: 0 0.1vw 0.5vw rgba(0, 0, 0, 0.18);
    }

    .bm-header {
        display: flex;
        align-items: baseline;
        padding: 0.7vw 1.2vw;
        gap: 0.8vw;
    }

    .bm-title {
        font-size: 3.3vw;
        font-weight: bold;
        line-height: 1.2;
    }

    .bm-date {
        font-size: 2.3vw;
        opacity: 0.8;
    }

    .bm-clock {
        margin-left: auto;
        font-size: 3.3vw;
        font-weight: bold;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
    }

    /* ---- Tafel: Zeitachse links, je Tabletsatz eine Spalte ---- */

    .bm-board {
        flex: 1;
        display: flex;
        min-height: 0;
        padding: 0.8vw;
        gap: 0.5vw;
    }

    /* feste Breite, sonst hat die absolut gesetzte Uhrzeit keinen Platz */
    .bm-timecol {
        flex: 0 0 4.6vw;
        display: flex;
        flex-direction: column;
    }

    /* leerer Block über der Zeitachse, damit sie auf Höhe der Spaltenköpfe beginnt */
    .bm-timecol-head {
        flex: 0 0 auto;
    }

    .bm-timecol-body {
        position: relative;
        flex: 1;
        min-height: 0;
        padding-right: 0.5vw;
    }

    .bm-hour {
        position: absolute;
        right: 0.5vw;
        transform: translateY(-50%);
        font-size: 1.5vw;
        font-variant-numeric: tabular-nums;
        opacity: 0.75;
        white-space: nowrap;
    }

    .bm-cols {
        flex: 1;
        display: flex;
        min-width: 0;
        gap: 0.4vw;
    }

    .bm-col {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
    }

    /* Spaltenkopf im Stil der Stundenplan-Kopfzeile: helle Leiste, oben abgerundet */
    .bm-col-head {
        flex: 0 0 auto;
        background-color: rgba(255, 255, 255, 0.75);
        border-radius: 0.4vw 0.4vw 0 0;
        padding: 0.45vw 0.3vw;
        text-align: center;
        font-size: 1.7vw;
        font-weight: bold;
        line-height: 1.15;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .bm-col.bm-col-free .bm-col-head {
        font-weight: normal;
        opacity: 0.6;
    }

    .bm-col-count {
        margin-left: 0.3vw;
        font-size: 1.2vw;
        font-weight: normal;
        opacity: 0.8;
    }

    .bm-col-track {
        position: relative;
        flex: 1;
        min-height: 0;
        background-color: rgba(255, 255, 255, 0.28);
        border-radius: 0 0 0.4vw 0.4vw;
        overflow: hidden;
    }

    /* waagerechte Stundenlinien als Orientierung, wie im Stundenplan */
    .bm-gridline {
        position: absolute;
        left: 0;
        right: 0;
        border-top: 1px solid rgba(0, 0, 0, 0.09);
    }

    .bm-gridline.bm-gridline-hour {
        border-top-color: rgba(0, 0, 0, 0.17);
    }

    .bm-break {
        position: absolute;
        left: 0;
        right: 0;
        background-color: rgba(0, 0, 0, 0.05);
    }

    /* ---- Buchungsblock, aufgebaut wie eine Stunde im Stundenplan ---- */

    .bm-booking {
        position: absolute;
        left: 0.2vw;
        right: 0.2vw;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        padding: 0.25vw 0.45vw;
        border-radius: 0.3vw;
        background-color: #{color_palette[:darker]};
        color: #fff;
        box-shadow: 0 0 0.3vw rgba(0, 0, 0, 0.3);
        overflow: hidden;
        z-index: 2;
    }

    .bm-booking.bm-booking-now {
        background-color: rgba(250, 211, 28, 0.95);
        color: #222;
    }

    .bm-booking.bm-booking-past {
        opacity: 0.4;
    }

    /* Kopfzeile des Blocks: Uhrzeit links, Raum rechts */
    .bm-booking-top {
        display: flex;
        align-items: baseline;
        gap: 0.4vw;
        font-size: 1.4vw;
        line-height: 1.2;
        opacity: 0.8;
        white-space: nowrap;
    }

    .bm-booking-room {
        margin-left: auto;
        font-weight: bold;
        opacity: 1;
    }

    .bm-booking-main {
        font-size: 1.7vw;
        font-weight: bold;
        line-height: 1.2;
        margin-top: 0.1vw;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .bm-booking-klasse {
        font-weight: normal;
        opacity: 0.85;
    }

    .bm-booking-who {
        font-size: 1.4vw;
        font-weight: normal;
        line-height: 1.2;
        opacity: 0.85;
        white-space: nowrap;
    }

    /* laufende Zeit als waagerechte Linie über alle Spalten */
    .bm-now-line {
        position: absolute;
        left: 0;
        right: 0;
        border-top: 2px solid #e8402a;
        z-index: 5;
        pointer-events: none;
    }

    /* nur die erste Spalte bekommt den Punkt, sonst stünde in jeder Spalte einer */
    .bm-now-line.bm-now-line-dot::before {
        content: '';
        position: absolute;
        left: -0.35vw;
        top: -0.35vw;
        width: 0.7vw;
        height: 0.7vw;
        border-radius: 50%;
        background-color: #e8402a;
    }

    .bm-empty {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.4vw;
        text-align: center;
        opacity: 0.7;
    }

    .bm-attribution {
        display: flex;
        justify-content: flex-end;
        font-size: 1.25vw;
        opacity: 0.75;
        padding-right: 0.3vw;
    }
</style>

<div class='bm-wrapper'>
    <div class='bm-header bm-card'>
        <div><span class='bm-title'>Tabletsatz-Buchungen heute</span></div>
        <div class='bm-date bm-date-here'></div>
        <div class='bm-clock bm-clock-here'></div>
    </div>
    <div class='bm-board bm-card'>
        <div class='bm-timecol'>
            <div class='bm-timecol-head bm-timecol-head-here'></div>
            <div class='bm-timecol-body bm-timecol-body-here'></div>
        </div>
        <div class='bm-cols bm-cols-here'></div>
        <div class='bm-empty bm-empty-here' style='display: none;'>Es sind keine Tabletsätze hinterlegt.</div>
    </div>
    <div class='bm-attribution'><span class='bm-color-scheme-here'></span><span style='margin: 0 0.5em;'>//</span>Stand: <span class='bm-updated-here'></span></div>
</div>

<script>
    var attribution = #{@@color_scheme_info[color_scheme[0, 19]].to_json};

    // Stundenraster als Orientierung, aus den echten Schulzeiten (HOURS_FOR_KLASSE,
    // siehe todays_booking_monitor_periods in tablet_set.rb).
    var BM_PERIODS = #{todays_booking_monitor_periods.to_json};

    var bm_ws = null;
    var bm_t0 = 8 * 60;
    var bm_t1 = 16 * 60;

    function hhmm_to_minutes(s) {
        let parts = (s || '').split(':');
        return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function minutes_to_hhmm(m) {
        let h = Math.floor(m / 60);
        let r = m % 60;
        return `${h}:${r < 10 ? '0' : ''}${r}`;
    }

    // Anfang und Ende des Tagesfensters: das Stundenraster, erweitert um Buchungen,
    // die davor beginnen oder danach enden - sonst stünden sie außerhalb der Tafel.
    function bm_update_day_window(data) {
        let t0 = null;
        let t1 = null;
        for (let period of BM_PERIODS) {
            let a = hhmm_to_minutes(period.start);
            let b = hhmm_to_minutes(period.end);
            t0 = (t0 === null) ? a : Math.min(t0, a);
            t1 = (t1 === null) ? b : Math.max(t1, b);
        }
        for (let id of Object.keys(data.bookings || {})) {
            for (let booking of data.bookings[id]) {
                let a = hhmm_to_minutes(booking.booking.start_time);
                let b = hhmm_to_minutes(booking.booking.end_time);
                t0 = (t0 === null) ? a : Math.min(t0, a);
                t1 = (t1 === null) ? b : Math.max(t1, b);
            }
        }
        if (t0 === null || t1 === null || t1 <= t0) {
            t0 = 8 * 60;
            t1 = 16 * 60;
        }
        bm_t0 = t0;
        bm_t1 = t1;
    }

    function bm_top(minutes) {
        return (minutes - bm_t0) * 100.0 / (bm_t1 - bm_t0);
    }

    function render_time_axis() {
        let body = $('.bm-timecol-body-here');
        body.empty();
        // volle Stunden beschriften, wie im Stundenplan
        let first = Math.ceil(bm_t0 / 60) * 60;
        for (let m = first; m <= bm_t1; m += 60) {
            $('<div>').addClass('bm-hour').css('top', `${bm_top(m)}%`)
                .text(minutes_to_hhmm(m)).appendTo(body);
        }
    }

    function render_grid(track) {
        let first = Math.ceil(bm_t0 / 60) * 60;
        for (let m = first; m <= bm_t1; m += 60) {
            $('<div>').addClass('bm-gridline bm-gridline-hour')
                .css('top', `${bm_top(m)}%`).appendTo(track);
        }
        for (let period of BM_PERIODS) {
            let a = hhmm_to_minutes(period.start);
            let b = hhmm_to_minutes(period.end);
            if (period.is_break) {
                $('<div>').addClass('bm-break').css('top', `${bm_top(a)}%`)
                    .css('height', `${bm_top(b) - bm_top(a)}%`).appendTo(track);
            } else {
                $('<div>').addClass('bm-gridline').css('top', `${bm_top(a)}%`).appendTo(track);
            }
        }
    }

    function render_bookings(data) {
        bm_update_day_window(data);
        render_time_axis();
        let cols = $('.bm-cols-here');
        cols.empty();
        // Reihenfolge kommt vom Server (nach Satznummer), alphabetisch nur als Rückfall
        let tablet_ids = data.order || Object.keys(data.bookings || {}).sort();
        if (tablet_ids.length === 0) {
            $('.bm-empty-here').show();
            $('.bm-timecol, .bm-cols').hide();
        } else {
            $('.bm-empty-here').hide();
            $('.bm-timecol, .bm-cols').css('display', '');
            for (let tablet_id of tablet_ids) {
                let bookings = data.bookings[tablet_id] || [];
                let col = $('<div>').addClass('bm-col').toggleClass('bm-col-free', bookings.length === 0);
                let head = $('<div>').addClass('bm-col-head').text(tablet_id);
                let count = (bookings.find((x) => x.tablet_set_count) || {}).tablet_set_count;
                if (count) {
                    head.append($('<span>').addClass('bm-col-count').text(`(${count})`));
                }
                col.append(head);
                let track = $('<div>').addClass('bm-col-track');
                render_grid(track);
                for (let booking of bookings) {
                    let t0 = hhmm_to_minutes(booking.booking.start_time);
                    let t1 = hhmm_to_minutes(booking.booking.end_time);
                    let div = $('<div>').addClass('bm-booking').data('t0', t0).data('t1', t1);
                    div.css('top', `${bm_top(t0)}%`).css('height', `${bm_top(t1) - bm_top(t0)}%`);

                    // Kopfzeile wie im Stundenplan: Uhrzeit links, Raum rechts
                    let top = $('<div>').addClass('bm-booking-top');
                    top.append($('<span>').text(`${booking.booking.start_time} – ${booking.booking.end_time}`));
                    if (booking.raum) {
                        top.append($('<span>').addClass('bm-booking-room').text(booking.raum));
                    }
                    div.append(top);

                    // Fach bzw. Grund kommt teilweise aus freiem Text der Lehrkraft und
                    // wird deshalb konsequent als Text und nie als HTML eingefügt.
                    let what = booking.lesson || booking.booking.reason || '';
                    let klasse = null;
                    let m = booking.lesson ? booking.lesson.match(/^(.+?)\s*\(([^()]+)\)$/) : null;
                    if (m) {
                        what = m[1];
                        klasse = m[2];
                    }
                    div.append($('<div>').addClass('bm-booking-main').text(what));

                    // Kürzel und Klasse stehen zusammen in einer eigenen Zeile, damit die
                    // Klasse erhalten bleibt, wenn das Fach aus Platzgründen wegfällt.
                    // Nur das Kürzel, bewusst kein Name - siehe todays_tablet_set_bookings_for_monitor.
                    let who = $('<div>').addClass('bm-booking-who');
                    if (booking.shorthand) who.append($('<span>').text(booking.shorthand));
                    if (klasse) {
                        if (booking.shorthand) who.append(document.createTextNode(' '));
                        who.append($('<span>').addClass('bm-booking-klasse').text(klasse));
                    }
                    if (booking.shorthand || klasse) div.append(who);
                    track.append(div);
                }
                col.append(track);
                cols.append(col);
            }
            // Zeitachse auf Höhe der Spaltenköpfe beginnen lassen
            let head_height = $('.bm-col-head').first().outerHeight() || 0;
            $('.bm-timecol-head-here').css('height', `${head_height}px`);
        }
        bm_hide_overflowing_lines();
        update_now_line();
        $('.bm-updated-here').text(moment().format('HH:mm:ss'));
    }

    // Ein Block ist so hoch, wie seine Buchung dauert - bei einer Einzelstunde bleibt
    // kaum Platz. Passt das Fach nicht vollständig hinein, wird es ganz weggelassen
    // statt mitten im Wort abgeschnitten; Uhrzeit, Raum, Kürzel und Klasse bleiben.
    // Gemessen wird am Fach selbst, nicht am Block: der Block ist ein Flex-Container,
    // dessen Kinder schrumpfen - er meldet deshalb nie einen Überlauf.
    function bm_hide_overflowing_lines() {
        $('.bm-booking').each(function () {
            let main = this.querySelector('.bm-booking-main');
            if (!main) return;
            main.style.display = '';
            if (main.scrollHeight > main.clientHeight + 1) {
                main.style.display = 'none';
            }
        });
    }

    function update_now_line() {
        let now = moment();
        $('.bm-clock-here').text(now.format('HH:mm:ss'));
        let minutes = now.hours() * 60 + now.minutes() + now.seconds() / 60.0;
        $('.bm-now-line').remove();
        if (minutes >= bm_t0 && minutes <= bm_t1) {
            $('.bm-col-track').each(function (index) {
                $('<div>').addClass('bm-now-line').toggleClass('bm-now-line-dot', index === 0)
                    .css('top', `${bm_top(minutes)}%`).appendTo(this);
            });
        }
        $('.bm-booking').each(function () {
            let t0 = $(this).data('t0');
            let t1 = $(this).data('t1');
            $(this).toggleClass('bm-booking-now', minutes >= t0 && minutes < t1);
            $(this).toggleClass('bm-booking-past', minutes >= t1);
        });
    }

    function bm_setup_ws() {
        let ws_uri = (location.protocol == 'http:' ? 'ws://' : 'wss://') + location.host + '/ws_monitor';
        bm_ws = new WebSocket(ws_uri);
        bm_ws.onmessage = function (event) {
            let data = JSON.parse(event.data);
            if (data.command == 'force_reload') {
                window.location.reload();
            }
            if (data.command == 'update_bookings') {
                // Es kommen bewusst keine Buchungsdaten über den (offenen) WebSocket -
                // die Seite lädt neu und bekommt sie serverseitig nach der Rechteprüfung.
                window.location.reload();
            }
        };
        bm_ws.onclose = function () {
            window.setTimeout(bm_setup_ws, 5000);
        };
    }

    window.addEventListener('load', function () {
        moment.locale('de');
        $('.bm-date-here').text(moment().format('dddd, D. MMMM YYYY'));
        if (attribution) {
            let a = $('<span>').append($('<b>').text(`»${attribution[0]}«`));
            if (attribution[1]) a.append(' von ').append($('<b>').text(attribution[1]));
            $('.bm-color-scheme-here').empty().append(a);
        }
        // script_safe, weil der Buchungsgrund freier Text ist: sonst könnte ein darin
        // enthaltenes script-Tag den Block hier vorzeitig beenden.
        render_bookings(#{JSON.generate(todays_tablet_set_bookings_for_monitor, :script_safe => true)});
        setInterval(update_now_line, 15000);
        bm_setup_ws();
    });
</script>
