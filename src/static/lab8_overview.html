#{assert(teacher_logged_in? || email_is_eligible_for_lab8?(@@user_info, @session_user[:email]))}
<div class='container-fluid white'>
    <div class='row'>
        <div class='col-md-12'>
            <h2 style='margin-bottom: 30px;'>Lab 8-Projekte</h2>
            <div id="table_here"></div>
        </div>
    </div>
</div>

<style>
    tbody tr {
        cursor: pointer;
    }
    tbody tr:hover {
        box-shadow: 0 0 0.5em rgba(0, 0, 0, 0.3);
    }
    body.dark tbody tr:hover {
        box-shadow: 0 0 0.5em rgba(255, 255, 255, 0.3);
    }
</style>

<script>
// project texts come from students: always insert them as text
function escapeHtml(str) {
    let div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}

function orDash(value) {
    return (value === null || value === undefined) ? '&ndash;' : escapeHtml(`${value}`);
}

window.addEventListener('load', function() {
    api_call('/api/lab8_overview', {}, function(data) {
        if (data.success) {
            let table = new SortableTable({
                element: $('#table_here'),
                xs: true,
                headers: ['Nr.', 'Mitglieder', 'Titel', 'Produkt', 'Orte', 'Tag 1', 'Tag 2', 'Tag 3', 'Tag 4'].map(function (x) {
                    let th = $('<th>').html(x);
                    return th;
                }),
                rows: data.rows.map(function (entry, index) {
                    console.log(entry);
                    let cells = [
                        entry.email,
                        `<td>${orDash(entry.projekt.nr)}</td>`,
                        `<td style='max-width: 20em;'>${escapeHtml(entry.sus)}</td>`,
                        `<td style='max-width: 20em;'>${orDash(entry.projekt.titel)}</td>`,
                        `<td style='max-width: 20em;'>${orDash(entry.projekt.produkt)}</td>`,
                        `<td style='max-width: 20em;'>${orDash(entry.projekt.orte)}</td>`,
                        `<td style='max-width: 20em;'>${orDash(entry.projekt.reflexion1)}</td>`,
                        `<td style='max-width: 20em;'>${orDash(entry.projekt.reflexion2)}</td>`,
                        `<td style='max-width: 20em;'>${orDash(entry.projekt.reflexion3)}</td>`,
                        `<td style='max-width: 20em;'>${orDash(entry.projekt.reflexion4)}</td>`,
                    ];
                    return cells;
                }),
                sortable: true,
                clickable_rows: true,
                clickable_row_callback: function(email) {
                    window.location.href = `/lab8/${email}`;
                }
            });
        }
    });
});
</script>
