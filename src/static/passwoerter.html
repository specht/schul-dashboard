#{this_is_a_page_for_passwords}
<div class="modal" id="mailCaseReplyModal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Antwort senden</h5>
      </div>
      <div class="modal-body">
        <div class='form-group'>
          <label for='ti_reply_to'>An</label>
          <input id='ti_reply_to' type='email' class='form-control' autocomplete='off' />
        </div>
        <div class='form-group'>
          <label for='ti_reply_subject'>Betreff</label>
          <input id='ti_reply_subject' class='form-control' maxlength='200' autocomplete='off' />
        </div>
        <div class='form-group'>
          <label for='ta_reply_body'>Text</label>
          <textarea id='ta_reply_body' class='form-control' rows='9'></textarea>
        </div>
        <p class='text-muted' style='margin-bottom: 0;'><i class='fa fa-paperclip'></i>&nbsp;&nbsp;<span id='reply_attachment'></span><br />
        Antworten gehen an dich, du bekommst eine Kopie.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Abbrechen</button>
        <button id='bu_send_mail_case_reply' class="btn btn-success"><i class='fa fa-paper-plane'></i>&nbsp;&nbsp;Senden</button>
      </div>
    </div>
  </div>
</div>

<div class='container' style='padding-top: 30px; padding-bottom: 30px;'>
    <div class='row'>
        <div class='col-lg-10 offset-lg-1'>
            <h2 style='margin-bottom: 20px;'>Passwörter</h2>
            <div class='api_messages' style='display: none;'></div>
            #{print_nextcloud_password_section()}
            #{print_mail_password_reset_page()}
        </div>
    </div>
</div>

<style>
    .mail-reset-row td { vertical-align: middle; }
    .mail-reset-password { font-family: monospace; font-size: 110%; }
    .mail-case-mailbox { display: inline-block; margin: 0 0.3em 0.3em 0; }
    .nc-actions .btn { margin: 0.2em; }
    /* phones: name, status and button one below the other */
    @media (max-width: 575px) {
        .mail-reset-row td { display: block; border-top: none; padding: 0.3em 0.75em; }
        .mail-reset-row td:first-child { padding-top: 0.75em; }
        .mail-reset-row td.mail-reset-action { text-align: left !important; padding-bottom: 0.75em; }
        .mail-reset-row + .mail-reset-row td:first-child { border-top: 1px solid rgba(0, 0, 0, 0.1); }
        #mail_cases td { display: block; border-top: none; }
        #mail_cases tr td:first-child { border-top: 1px solid rgba(0, 0, 0, 0.1); }
        #mail_cases thead { display: none; }
        #mail_cases td.mail-case-actions { text-align: left !important; white-space: normal !important; }
        .nc-login-table th, .nc-login-table td { display: block; border-top: none; padding: 0.2em 0; }
        .nc-login-table tr + tr th { padding-top: 0.75em; }
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const IS_STUDENT = #{schueler_logged_in? ? 'true' : 'false'};
    const STATE_LABELS = {
        open: 'wartet auf Freigabe',
        approved: 'wird bearbeitet …',
        done: 'zurückgesetzt',
        failed: 'hat nicht geklappt',
        rejected: 'abgelehnt',
    };
    let refresh_timer = null;
    let case_mailboxes = [];
    let reply_case_id = null;

    // ---- Nextcloud ----

    if ($('#ti_nc_login').length > 0) {
        install_clipboard_handler('.btn-clipboard');
        $('.bu-show-password').on('click', function() {
            $('#ti_initial_nc_password').attr('type', 'text');
        });
        $('.bu-reset-nc-password').on('click', function() {
            dashboardConfirm('Dein Nextcloud-Passwort wird auf dein Initialpasswort zurückgesetzt. Ein selbst gewähltes Passwort funktioniert danach nicht mehr.', function() {
                $('#nc_reset_result').empty();
                api_call('/api/reset_nc_password', {}, function(data) {
                    const ok = data.success && !data.error;
                    $('#nc_reset_result').append($('<div>').addClass('alert').addClass(ok ? 'alert-success result-success' : 'alert-danger result-error')
                        .text(ok ? 'Dein Nextcloud-Passwort wurde auf dein Initialpasswort zurückgesetzt.' : 'Dein Nextcloud-Passwort konnte leider nicht zurückgesetzt werden.'));
                });
            }, { title: 'Nextcloud-Passwort zurücksetzen?', confirm: 'Zurücksetzen', danger: true });
        });
    }

    // ---- E-Mail ----

    function fmt_ts(ts) {
        if (!ts) return '';
        const d = new Date(ts * 1000);
        const pad = (x) => (x < 10 ? '0' : '') + x;
        return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    // password hidden until asked for (shoulder surfing in class)
    function password_widget(password) {
        const wrap = $('<div>').css('margin-top', '0.3em');
        const code = $('<span>').addClass('mail-reset-password').text(password).hide();
        const show = $('<button>').addClass('btn btn-sm btn-outline-secondary bu_show_mail_password')
            .html("<i class='fa fa-eye'></i>&nbsp;&nbsp;Passwort anzeigen");
        show.on('click', function(e) {
            $(e.currentTarget).hide();
            code.show();
        });
        wrap.append(show).append(code);
        return wrap;
    }

    function state_label(entry) {
        const label = $('<span>').addClass('mail-reset-state-label').attr('data-state', entry.state)
            .text(STATE_LABELS[entry.state] || entry.state);
        if (entry.state === 'approved') label.prepend("<i class='fa fa-cog fa-spin'></i>&nbsp;");
        if (entry.state === 'done') label.addClass('text-success');
        if (entry.state === 'failed' || entry.state === 'rejected') label.addClass('text-danger');
        return label;
    }

    // status of one mailbox for students and Klassenleitung
    function row_state(entry, item) {
        const cell = $('<div>');
        cell.append(state_label(entry));
        cell.append($('<small>').addClass('text-muted').text(' (' + fmt_ts(entry.ts_done || entry.ts) + ')'));
        if (entry.state === 'done' && item.password) cell.append(password_widget(item.password));
        if (entry.state === 'open') {
            cell.append($('<div>').addClass('text-muted').text('Die Administration schaut sich die Anfrage an.'));
        } else if (entry.state === 'failed') {
            cell.append($('<div>').addClass('text-muted').text(IS_STUDENT
                ? 'Die Administration wurde informiert und kümmert sich darum.'
                : 'Die Administration wurde informiert.'));
        } else if (entry.state === 'rejected') {
            cell.append($('<div>').addClass('text-muted').text('Bitte wende dich an die Administration.'));
        }
        return cell;
    }

    function render_rows(data) {
        const latest = {};
        for (const entry of data.cases) {
            for (const item of entry.mailboxes) {
                if (item.latest) latest[item.mailbox] = { entry: entry, item: item };
            }
        }
        $('.mail-reset-row').each(function(_, row) {
            const found = latest[$(row).data('mailbox')];
            $(row).find('.mail-reset-state').empty().append(found ? row_state(found.entry, found.item) : '');
            const active = !!found && (found.entry.state === 'open' || found.entry.state === 'approved');
            $(row).find('.bu_request_mail_reset').prop('disabled', active);
        });
    }

    function render_cases(data) {
        const table = $('#mail_cases tbody');
        if (table.length === 0) return;
        table.empty();
        // open and approved cases first, then the history (newest first)
        const active = (entry) => (entry.state === 'open' || entry.state === 'approved') ? 0 : 1;
        const sorted = data.cases.slice().sort((a, b) => active(a) - active(b) || b.ts - a.ts);
        for (const entry of sorted) {
            const tr = $('<tr>').addClass('mail-case').attr('data-id', entry.id).attr('data-state', entry.state);
            const boxes = $('<td>');
            for (const item of entry.mailboxes) {
                const div = $('<div>').addClass('mail-case-mailbox-entry').attr('data-mailbox', item.mailbox);
                div.append($('<span>').text(item.label)).append($('<br>')).append($('<small>').addClass('text-muted').text(item.mailbox));
                if (entry.state === 'done' && item.password) div.append(password_widget(item.password));
                boxes.append(div);
            }
            tr.append(boxes);
            const origin = $('<td>');
            if (entry.source === 'mail') {
                origin.append($('<span>').text('E-Mail' + (entry.reply_to ? ' von ' + entry.reply_to : '')));
            } else {
                origin.append($('<span>').text('Dashboard: ' + (entry.requested_by || '')));
            }
            origin.append($('<br>')).append($('<small>').addClass('text-muted').text(fmt_ts(entry.ts)));
            if (entry.note) origin.append($('<div>').addClass('text-muted').text(entry.note));
            tr.append(origin);
            const state = $('<td>').append(state_label(entry));
            if (entry.ts_done) state.append($('<small>').addClass('text-muted').text(' (' + fmt_ts(entry.ts_done) + ')'));
            if (entry.message) state.append($('<div>').addClass('text-muted').text(entry.message));
            if (entry.ts_reply) {
                state.append($('<div>').addClass('text-muted mail-case-replied').text('Antwort an ' + entry.reply_sent_to + ' gesendet (' + fmt_ts(entry.ts_reply) + ')'));
            }
            tr.append(state);
            const actions = $('<td>').addClass('mail-case-actions').css('text-align', 'right').css('white-space', 'nowrap');
            const button = (cls, text, style) => $('<button>').addClass(`btn btn-sm ${style} ${cls}`).attr('data-id', entry.id).text(text);
            if (entry.state === 'open') {
                actions.append(button('bu_mail_case_approve', 'Freigeben', 'btn-outline-success')).append(' ');
                actions.append(button('bu_mail_case_reject', 'Ablehnen', 'btn-outline-secondary'));
            } else if (entry.state === 'approved') {
                actions.append(button('bu_mail_case_done', 'erledigt', 'btn-outline-success')).append(' ');
                actions.append(button('bu_mail_case_failed', 'fehlgeschlagen', 'btn-outline-secondary'));
            } else if (entry.state === 'done' && entry.source === 'mail') {
                actions.append(button('bu_mail_case_reply', entry.ts_reply ? 'Erneut antworten…' : 'Antwort senden…', entry.reply_to && !entry.ts_reply ? 'btn-success' : 'btn-outline-secondary'));
            }
            tr.append(actions);
            table.append(tr);
        }
        if (data.cases.length === 0) {
            table.append($('<tr>').append($('<td>').attr('colspan', 4).addClass('text-muted').text('Keine Anfragen in den letzten 30 Tagen.')));
        }
        $('#mail_reset_bot_state').text(data.bot_last_seen
            ? 'Bot zuletzt aktiv: ' + fmt_ts(data.bot_last_seen)
            : 'Der Bot war noch nie aktiv – freigegebene Anfragen bitte von Hand erledigen.');
    }

    function render(data) {
        render_rows(data);
        render_cases(data);
        clearTimeout(refresh_timer);
        if (data.cases.some((entry) => entry.state === 'open' || entry.state === 'approved')) {
            refresh_timer = setTimeout(load, 10000);
        }
    }

    function load() {
        if ($('.mail-reset-row').length === 0 && $('#mail_cases').length === 0) return;
        api_call('/api/mail_password_reset_status', {}, function(data) {
            if (data.success) render(data);
        }, { no_please_wait: true });
    }

    function request_reset(mailbox, label) {
        const text = IS_STUDENT
            ? 'Dein E-Mail-Passwort wird nach Freigabe durch die Administration auf das ursprüngliche Passwort aus deinem E-Mail-Brief zurückgesetzt. Ein selbst gewähltes Passwort funktioniert danach nicht mehr. Deine Eltern bekommen eine kurze Nachricht darüber.'
            : `Das Passwort für ${label} (${mailbox}) wird nach Freigabe durch die Administration auf das ursprüngliche Passwort aus dem E-Mail-Brief zurückgesetzt. Ein selbst gewähltes Passwort funktioniert danach nicht mehr.`;
        dashboardConfirm(text, function() {
            api_call('/api/request_mail_password_reset', { mailbox: mailbox }, function(data) {
                if (!data.success) return;
                if (data.result === 'pending') {
                    dashboardAlert('Für dieses Postfach läuft schon eine Anfrage.', 'Schon beantragt');
                } else if (data.result === 'limit') {
                    dashboardAlert('Das Passwort wurde heute schon mehrmals zurückgesetzt. Bitte versuche es morgen noch einmal oder wende dich an die Administration.', 'Heute nicht mehr möglich');
                }
                load();
            });
        }, { title: 'E-Mail-Passwort zurücksetzen?', confirm: 'Beantragen', danger: true });
    }

    $('.bu_request_mail_reset').on('click', function(e) {
        const button = $(e.currentTarget);
        request_reset(button.data('mailbox'), button.data('label'));
    });

    // admin: a request that came in by mail
    function render_case_mailboxes() {
        const div = $('#mail_case_mailboxes').empty();
        for (const mailbox of case_mailboxes) {
            const chip = $('<span>').addClass('badge badge-secondary mail-case-mailbox').text(mailbox + ' ');
            const remove = $('<a>').attr('href', '#').addClass('text-white').html("<i class='fa fa-times'></i>");
            remove.on('click', function(e) {
                e.preventDefault();
                case_mailboxes = case_mailboxes.filter((x) => x !== mailbox);
                render_case_mailboxes();
            });
            div.append(chip.append(remove));
        }
    }
    function add_case_mailbox() {
        const mailbox = $('#ti_mail_case_mailbox').val().trim().toLowerCase();
        if (mailbox.length === 0) return;
        if (case_mailboxes.indexOf(mailbox) < 0) case_mailboxes.push(mailbox);
        $('#ti_mail_case_mailbox').val('');
        render_case_mailboxes();
    }
    $('#bu_add_mail_case_mailbox').on('click', add_case_mailbox);
    $('#ti_mail_case_mailbox').on('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); add_case_mailbox(); }
    });
    $('#bu_create_mail_case').on('click', function() {
        add_case_mailbox();
        if (case_mailboxes.length === 0) {
            dashboardAlert('Bitte mindestens ein Postfach eintragen.', 'Kein Postfach');
            return;
        }
        const payload = {
            mailboxes: case_mailboxes,
            reply_to: $('#ti_mail_case_reply_to').val().trim(),
            note: $('#ti_mail_case_note').val().trim(),
        };
        dashboardConfirm(`Die Passwörter für ${case_mailboxes.join(', ')} werden auf das ursprüngliche Passwort aus dem E-Mail-Brief zurückgesetzt.`, function() {
            api_call('/api/create_mail_password_case', payload, function(data) {
                if (!data.success) return;
                if (data.result === 'pending') {
                    dashboardAlert('Für eines dieser Postfächer läuft schon eine Anfrage.', 'Schon beantragt');
                    return;
                }
                case_mailboxes = [];
                render_case_mailboxes();
                $('#ti_mail_case_reply_to').val('');
                $('#ti_mail_case_note').val('');
                load();
            });
        }, { title: 'Passwörter zurücksetzen?', confirm: 'Freigeben', danger: true });
    });

    $('#mail_cases').on('click', '.bu_mail_case_approve, .bu_mail_case_reject', function(e) {
        const button = $(e.currentTarget);
        const decision = button.hasClass('bu_mail_case_approve') ? 'approve' : 'reject';
        api_call('/api/decide_mail_password_case', { id: button.data('id'), decision: decision }, function(data) {
            if (data.success) load();
        });
    });
    $('#mail_cases').on('click', '.bu_mail_case_done, .bu_mail_case_failed', function(e) {
        const button = $(e.currentTarget);
        const state = button.hasClass('bu_mail_case_done') ? 'done' : 'failed';
        api_call('/api/set_mail_password_case_state', { id: button.data('id'), state: state }, function(data) {
            if (data.success) load();
        });
    });
    $('#mail_cases').on('click', '.bu_mail_case_reply', function(e) {
        reply_case_id = $(e.currentTarget).data('id');
        api_call('/api/mail_password_case_reply_draft', { id: reply_case_id }, function(data) {
            if (!data.success) return;
            $('#ti_reply_to').val(data.to);
            $('#ti_reply_subject').val(data.subject);
            $('#ta_reply_body').val(data.body);
            $('#reply_attachment').text(data.attachment);
            $('#mailCaseReplyModal').modal('show');
        });
    });
    $('#bu_send_mail_case_reply').on('click', function() {
        const payload = {
            id: reply_case_id,
            to: $('#ti_reply_to').val().trim(),
            subject: $('#ti_reply_subject').val().trim(),
            body: $('#ta_reply_body').val(),
        };
        if (payload.to.length === 0) {
            dashboardAlert('Bitte eine Empfängeradresse eintragen.', 'Kein Empfänger');
            return;
        }
        api_call('/api/send_mail_password_case_reply', payload, function(data) {
            if (!data.success) return;
            $('#mailCaseReplyModal').modal('hide');
            load();
        });
    });

    load();
});
</script>
