#{redirect_on_error { require_teacher!; assert(sph_can_view?(sitzplan_path_params[0])) }}
<style>
/* Große Räume nutzen die ganze Breite, damit der ganze Plan auf einmal zu
   sehen ist (etwa am Beamer). */
.spa-container {
    max-width: max(1100px, 96vw);
    margin: 1.5em auto;
    padding: 1em;
    text-align: center;
    /* Karte wie im Sitzplan, sonst steht der Text direkt auf dem Hintergrundbild */
    background-color: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    border-radius: 0.5em;
    box-shadow: 0 0.2em 0.6em rgba(0,0,0,0.15);
}
body.dark .spa-container {
    background-color: rgba(30, 33, 31, 0.9);
    color: #e4e8e5;
}
body.dark #spa_seats .place {
    background-color: #2a2f2c;
}
body.dark .spa-card-name {
    color: #eee;
}
/* Nur zur Sicherheit: Der Plan wird so klein gezeichnet, dass er ganz ins
   Fenster passt (siehe render_seats). */
.spa-seat-scroll {
    overflow-x: auto;
}
.spa-tafel {
    display: block;
    width: fit-content;
    margin: 1.5em auto 0 auto;
    background-color: #2f3e2f;
    color: #fff;
    font-weight: bold;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.4em 3em;
    border-radius: 0.3em;
    box-shadow: 0 0.2em 0.4em rgba(0,0,0,0.3);
}
#spa_seats {
    position: relative;
    margin: 2em auto;
}
#spa_seats .place {
    position: absolute;
    box-shadow: 0 0 0.7vh rgba(0,0,0,0.5);
    background-color: #fff;
    border-radius: 1vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2px;
}
/* Wie im Sitzplan: Foto im Quadrat, darunter der ganze Name. Das Foto ist
   ein echtes Bild (kein Hintergrundbild): Browser lassen Hintergrundbilder
   beim Drucken standardmäßig weg. */
.spa-card-photo {
    flex: none;
    display: block;
    border-radius: 12%;
    background-color: #e4e9e5;
    object-fit: cover;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
}
.spa-card-name {
    width: 100%;
    margin-top: 3px;
    line-height: 1.1;
    font-weight: bold;
    color: #222;
    word-break: normal;
    overflow-wrap: normal;
}
.spa-card-name.spa-break-anywhere {
    overflow-wrap: anywhere;
}
.spa-card-name span {
    display: block;
}
.spa-name-choice {
    margin-top: 0.3em;
}
.spa-empty-hint {
    color: #666;
    margin-top: 2em;
}
/* Ausdruck: nur Überschrift, Tafel und Plätze, ohne Dashboard-Menü,
   Hintergrundbild und Schatten (die werden oft gar nicht oder grau gedruckt). */
@page {
    size: landscape;
    margin: 1cm;
}
@media print {
    nav, .foot, a.github, .info, #advent_calendar, .grain_overlay, .spa-no-print {
        display: none !important;
    }
    body {
        background: #fff !important;
        color: #000 !important;
        padding: 0 !important;
        margin: 0 !important;
    }
    #main_container::after {
        display: none !important;
    }
    .spa-container {
        max-width: none;
        padding: 0;
        background: none !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
    }
    .spa-seat-scroll {
        overflow: visible;
    }
    .spa-card-name {
        color: #000 !important;
    }
    .spa-container h1 {
        margin-top: 0;
    }
    .spa-tafel {
        background: #fff;
        color: #000;
        border: 2px solid #000;
        box-shadow: none;
    }
    #spa_seats {
        margin: 1.5em auto 0 auto;
    }
    #spa_seats .place {
        box-shadow: none;
        border: 1.5px solid #000;
        color: #000;
    }
}
</style>
<div class="spa-container">
    <h1>Sitzplan <span id="spa_label"></span></h1>
    <div class='api_messages'></div>
    <p id="spa_saved_at" class="text-muted"></p>
    <!-- Ganze Namen passen in großen Räumen (kleine Plätze, Beamer) oft nicht.
         Die Wahl gilt auch für den Ausdruck und wird im Browser gemerkt. -->
    <div class="btn-group btn-group-sm spa-name-choice spa-no-print" role="group" aria-label="Namen" id="spa_name_choice" style="display: none;">
        <button type="button" class="btn btn-outline-secondary" id="bu_spa_names_full" data-mode="full">Ganze Namen</button>
        <button type="button" class="btn btn-outline-secondary" id="bu_spa_names_first" data-mode="first" title="Nur der Vorname; haben zwei denselben Vornamen, steht bei ihnen der Nachname">Nur Vornamen</button>
    </div>
    <span class="spa-tafel">Tafel</span>
    <div class="spa-seat-scroll"><div id="spa_seats"></div></div>
    <p class="spa-empty-hint" id="spa_empty_hint" style="display: none;">Für diese Klasse/diesen Raum wurde noch kein Sitzplan gespeichert.</p>
</div>

<script>
var klasse = '';
var raum = '';
var seats = [];
var seats_dict = {};

// Bestuhlung aller Räume (siehe sitzplan_daten.rb). Fehlt der Raum, erscheint
// unten ein Hinweis.
#{sitzplan_seats_js}

document.addEventListener('DOMContentLoaded', function () {
    let parts = window.location.pathname.replace('/sitzplananzeige/', '').split('/');
    klasse = parts[0];
    raum = parts[1];
    seats = seats_dict[raum];
    if (!seats) {
        $('.spa-container').empty()
            .append($('<h1>').text('Sitzplan'))
            .append($('<p>').text(`Für Raum ${raum} ist noch kein Sitzplan hinterlegt.`));
        return;
    }
    $('#spa_label').text(`${klasse} – Raum ${raum}`);

    // Ohne ?cycle=... wird der zuletzt gespeicherte Plan gezeigt. Mit
    // ?cycle=... zeigt der Link aus „Frühere Sitzpläne“ gezielt einen
    // bestimmten, ggf. älteren Plan.
    let cycle_id = new URLSearchParams(window.location.search).get('cycle');
    let request = {klasse: klasse, raum: raum};
    if (cycle_id) request.cycle_id = cycle_id;

    api_call('/api/sph_get_public_plan', request, function (data) {
        if (!data.places || data.places.length === 0) {
            $('#spa_empty_hint').show();
            return;
        }
        if (data.saved_at) {
            let d = new Date((data.updated_at || data.saved_at) * 1000);
            $('#spa_saved_at').text(`Stand: ${d.toLocaleDateString('de-DE')}`);
        }
        places = data.places;
        $('#spa_name_choice').show();
        set_name_mode(name_mode);
        $('#spa_name_choice button').click(function (e) {
            set_name_mode($(e.currentTarget).data('mode'));
            try { localStorage.setItem('sitzplananzeige_names', name_mode); } catch (err) {}
            render_seats(printing);
        });
        render_seats(false);
        // Für den Ausdruck auf eine Querformat-Seite zugeschnitten zeichnen,
        // danach wieder in Bildschirmgröße.
        window.addEventListener('beforeprint', function () { printing = true; render_seats(true); });
        window.addEventListener('afterprint', function () { printing = false; render_seats(false); });
        // Fenstergröße geändert (Beamer, Vollbild, Handy gedreht): neu einpassen.
        let resize_timer = null;
        window.addEventListener('resize', function () {
            clearTimeout(resize_timer);
            resize_timer = setTimeout(function () { if (!printing) render_seats(false); }, 150);
        });
        // ?print=1 (Knopf „Drucken“ auf der Sitzplan-Seite) öffnet direkt
        // den Druckdialog - erst wenn die Fotos geladen sind, sonst fehlen
        // sie auf dem Papier (spätestens nach 5 Sekunden trotzdem).
        if (new URLSearchParams(window.location.search).get('print') === '1') {
            photos_loaded(5000).then(function () { window.print(); });
        }
    });
});

var places = [];
var printing = false;
// 'full': Vor- und Nachname; 'first': nur der Vorname, bei gleichen
// Vornamen in der Klasse der Nachname.
var name_mode = 'full';
try { if (localStorage.getItem('sitzplananzeige_names') === 'first') name_mode = 'first'; } catch (err) {}

function set_name_mode(mode) {
    name_mode = mode === 'first' ? 'first' : 'full';
    $('#spa_name_choice button').each(function () {
        let on = $(this).data('mode') === name_mode;
        $(this).toggleClass('active', on).attr('aria-pressed', on ? 'true' : 'false');
    });
}

// Vornamen, die im Plan mehr als einmal vorkommen.
function duplicate_first_names() {
    let count = {};
    for (let p of places) {
        let key = (p.first_name || '').trim().toLowerCase();
        if (key) count[key] = (count[key] || 0) + 1;
    }
    return new Set(Object.keys(count).filter((k) => count[k] > 1));
}
// Die Foto-Elemente bleiben beim Umzeichnen (Bildschirm/Druck) dieselben,
// damit sie nicht neu laden müssen, während der Druck schon läuft.
var photo_for_place = {};

function photos_loaded(timeout_ms) {
    let pending = $('#spa_seats img.spa-card-photo').toArray()
        .filter((img) => !img.complete)
        .map((img) => new Promise(function (resolve) {
            img.addEventListener('load', resolve, {once: true});
            img.addEventListener('error', resolve, {once: true});
        }));
    let timeout = new Promise((resolve) => setTimeout(resolve, timeout_ms));
    return Promise.race([Promise.all(pending), timeout]);
}

function photo_for(place) {
    let key = `${place.seat_index}/${place.nc_login || ''}`;
    if (!photo_for_place[key]) {
        let img = document.createElement('img');
        img.className = 'spa-card-photo';
        img.alt = '';
        img.addEventListener('error', function () {
            if (img.src !== SPA_SILHOUETTE) img.src = SPA_SILHOUETTE;
        });
        img.src = place.nc_login
            ? `#{NEXTCLOUD_URL}/index.php/avatar/${encodeURIComponent(place.nc_login)}/128`
            : SPA_SILHOUETTE;
        photo_for_place[key] = img;
    }
    return photo_for_place[key];
}

// Graue Figur, solange das Foto lädt oder wenn es keins gibt.
const SPA_SILHOUETTE = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><circle cx='10' cy='7.6' r='4' fill='%23a3aea7'/><ellipse cx='10' cy='19.5' rx='7.5' ry='6.5' fill='%23a3aea7'/></svg>";

function render_seats(for_print) {
    let w = 1, h = 1;
    for (let s of seats) {
        if (s[0] + 1 > w) w = s[0] + 1;
        if (s[1] + 1 > h) h = s[1] + 1;
    }
    let container = $('#spa_seats');
    // detach statt empty: die Foto-Elemente werden wiederverwendet.
    container.find('img.spa-card-photo').detach();
    container.empty();
    let scale;
    if (for_print) {
        // A4 quer mit 1 cm Rand: ca. 1040 × 720 px nutzbar, davon gehen
        // Überschrift und Tafel ab.
        scale = Math.min(110, 1000 / w, 500 / h);
    } else {
        // Der ganze Raum muss auf einmal zu sehen sein, auch ein großer: so
        // groß, wie Breite und Höhe des Fensters es erlauben (unter der Tafel,
        // ohne Scrollen). Kleine Räume werden nicht riesig; auf dem Handy
        // werden große Räume eben klein (die Namen passen sich an).
        let container_width = $('.spa-container').width() || 900;
        let top = container.offset().top;
        let height = Math.max(window.innerHeight * 0.5, window.innerHeight - Math.max(top, 0) - 90);
        scale = Math.max(10, Math.min(130, container_width / w, height / h));
    }
    container.css('height', `${h * scale}px`).css('width', `${w * scale}px`);
    let size = scale * 0.9;
    let duplicates = duplicate_first_names();
    for (let place of places) {
        let seat = seats[place.seat_index];
        if (!seat) continue;
        let div = $('<div>').addClass('place')
            .css('left', `${seat[0] * scale}px`).css('top', `${seat[1] * scale}px`)
            .css('width', `${size}px`).css('height', `${size}px`);
        // Wie im Sitzplan der Klassenleitung: Foto im Quadrat, darunter der
        // ganze Name, Vor- und Nachname je in einer Zeile.
        let photo_size = Math.round(size * 0.42);
        let photo = photo_for(place);
        photo.style.width = photo.style.height = `${photo_size}px`;
        div.append(photo);
        let name = $('<div>').addClass('spa-card-name').css('font-size', `${Math.max(8, Math.min(20, size * 0.155))}px`);
        let first = (place.first_name || '').trim();
        if (name_mode === 'first' && first) {
            // Eine Zeile reicht, die Schrift darf größer sein.
            let same = duplicates.has(first.toLowerCase()) && place.last_name;
            name.css('font-size', `${Math.max(8, Math.min(28, size * 0.2))}px`)
                .append($('<span>').text(same ? place.last_name : first));
        } else if (place.first_name || place.last_name) {
            name.append($('<span>').text(place.first_name || ''))
                .append(document.createTextNode(' '))
                .append($('<span>').text(place.last_name || ''));
        } else {
            name.text(place.display_name);
        }
        div.append(name);
        container.append(div);
    }
    fit_names(container);
}

// Namen nie abschneiden: erst die Schrift kleiner, dann das Foto, zuletzt
// darf ein Wort umbrechen.
function fit_names(container) {
    container.find('.place').each(function () {
        let card = this;
        let name = card.querySelector('.spa-card-name');
        let photo = card.querySelector('.spa-card-photo');
        let overflows = () => name.scrollWidth > name.clientWidth + 1 || card.scrollHeight > card.clientHeight + 1;
        let fs = parseFloat(name.style.fontSize);
        while (overflows() && fs > 7) {
            fs -= 0.5;
            name.style.fontSize = `${fs}px`;
        }
        let ps = parseFloat(photo.style.width);
        while (overflows() && ps > card.clientWidth * 0.3) {
            ps -= 2;
            photo.style.width = photo.style.height = `${ps}px`;
        }
        if (overflows()) name.classList.add('spa-break-anywhere');
    });
}
</script>
