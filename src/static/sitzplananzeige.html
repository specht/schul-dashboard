#{redirect_on_error { require_user! }}
<style>
.spa-container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1em;
    text-align: center;
}
.spa-tafel {
    display: block;
    width: fit-content;
    margin: 1.5em auto 0 auto;
    background-color: #2f3e2f;
    color: #fff;
    font-weight: bold;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.4em 3em;
    border-radius: 0.3em;
    box-shadow: 0 0.2em 0.4em rgba(0,0,0,0.3);
}
#spa_seats {
    position: relative;
    margin: 2em auto;
}
#spa_seats .place {
    position: absolute;
    box-shadow: 0 0 0.7vh rgba(0,0,0,0.5);
    background-color: #fff;
    border-radius: 1vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: bold;
    padding: 4px;
    word-break: break-word;
}
.spa-empty-hint {
    color: #666;
    margin-top: 2em;
}
</style>
<div class="spa-container">
    <h1>Sitzplan <span id="spa_label"></span></h1>
    <p id="spa_saved_at" class="text-muted"></p>
    <span class="spa-tafel">Tafel</span>
    <div id="spa_seats"></div>
    <p class="spa-empty-hint" id="spa_empty_hint" style="display: none;">Für diese Klasse/diesen Raum wurde noch kein Sitzplan gespeichert.</p>
</div>

<script>
var klasse = '';
var raum = '';
var seats = [];
var seats_dict = {};

// Raum-Layouts, geteilt mit dem Sitzplan-Shuffler. Fehlt die Datei, bleibt
// seats_dict leer und unten erscheint ein Hinweis statt eines Serverfehlers.
#{File.exist?('/data/sitzplan/seats.js') ? File.read('/data/sitzplan/seats.js') : ''}

document.addEventListener('DOMContentLoaded', function () {
    let parts = window.location.pathname.replace('/sitzplananzeige/', '').split('/');
    klasse = parts[0];
    raum = parts[1];
    seats = seats_dict[raum];
    if (!seats) {
        $('.spa-container').empty()
            .append($('<h1>').text('Sitzplan'))
            .append($('<p>').text(`Für Raum ${raum} ist noch kein Sitzplan hinterlegt.`));
        return;
    }
    $('#spa_label').text(`${klasse} – Raum ${raum}`);

    // Ohne ?cycle=... wird der zuletzt gespeicherte Plan gezeigt (Normalfall
    // für SuS). Mit ?cycle=... zeigt der Link aus der Historien-Liste im
    // Sitzplanhelfer gezielt einen bestimmten, ggf. älteren Plan.
    let cycle_id = new URLSearchParams(window.location.search).get('cycle');
    let request = {klasse: klasse, raum: raum};
    if (cycle_id) request.cycle_id = cycle_id;

    api_call('/api/sph_get_public_plan', request, function (data) {
        if (!data.places || data.places.length === 0) {
            $('#spa_empty_hint').show();
            return;
        }
        if (data.saved_at) {
            let d = new Date(data.saved_at * 1000);
            $('#spa_saved_at').text(`Stand: ${d.toLocaleDateString('de-DE')}`);
        }
        let w = 1, h = 1;
        for (let s of seats) {
            if (s[0] + 1 > w) w = s[0] + 1;
            if (s[1] + 1 > h) h = s[1] + 1;
        }
        let container = $('#spa_seats');
        let container_width = Math.min($('.spa-container').width() || 900, 900);
        let scale = Math.min(90, container_width / w);
        container.css('height', `${h * scale}px`).css('width', `${w * scale}px`);
        for (let place of data.places) {
            let seat = seats[place.seat_index];
            if (!seat) continue;
            let div = $('<div>').addClass('place')
                .css('left', `${seat[0] * scale}px`).css('top', `${seat[1] * scale}px`)
                .css('width', `${scale * 0.9}px`).css('height', `${scale * 0.9}px`)
                .css('font-size', `${scale * 0.14}px`)
                .text(place.display_name);
            container.append(div);
        }
    });
});
</script>
